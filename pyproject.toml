[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "rust-python-template"
version = "0.1.0"
description = "A modern Rust-core + Python-frontend (PyO3) project template."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10"
authors = [{ name = "Noé Fontana", email = "noe.fontana.pro@gmail.com" }]
keywords = ["template", "rust", "python", "pyo3", "maturin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/NoeFontana/rust-python-template"
Repository = "https://github.com/NoeFontana/rust-python-template.git"
Issues = "https://github.com/NoeFontana/rust-python-template/issues"

[dependency-groups]
dev = [
    "maturin>=1.13,<2.0",
    "pytest>=9",
    "ruff>=0.15",
    "pyright>=1.1.400",
]

[tool.maturin]
manifest-path = "crates/rust-python-template-ffi/Cargo.toml"
module-name = "rust_python_template._core"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true
include = [
    { path = "LICENSE-MIT", format = "sdist" },
    { path = "LICENSE-APACHE", format = "sdist" },
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"
extend-exclude = [".venv", "target", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ARG"]

[tool.pyright]
include = ["python", "tests/python"]
exclude = ["**/__pycache__", ".venv", "build", "dist", "target"]
extraPaths = ["python"]
pythonVersion = "3.10"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests/python"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
