[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "transform_tree"
# Hand-kept copy of `[workspace.package] version` in the root `Cargo.toml`;
# maturin reads it from here, and the two must agree.
version = "0.0.6"
description = "A transform tree engine — faster and more scalable than ROS tf2"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Noé Fontana", email = "noe.fontana.pro@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2.2.6"]

[dependency-groups]
# Floors and their reasons: `docs/PHASE3.md` §10.1.
dev = ["maturin>=1.14.1,<2.0", "pytest>=9.1.1", "ruff>=0.16.2", "pyright>=1.1.411"]

[tool.maturin]
manifest-path = "crates/tf_tree_py/Cargo.toml"
module-name = "tf_tree._core"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true
# The sdist must ship the license files it declares (PyPI rejects it otherwise);
# maturin's sdist selection does not pick up workspace-root files.
include = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv", "target", "dist"]

[tool.ruff.format]
# Keep ruff out of `docs/`' fenced blocks (PHASE3 §10.1).
exclude = ["**/*.md"]

[tool.ruff.lint]
# Explicit so an upgrade cannot change the set (PHASE3 §10.1).
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.pytest.ini_options]
minversion = "9.1"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests/python"]

[tool.pyright]
include = ["python"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
# Without these pyright reports every numpy type as unknown.
venvPath = "."
venv = ".venv"
# Read the `.pyi`, not the `.so`.
stubPath = "python"
