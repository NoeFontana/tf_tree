[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "transform_tree"
# The wheel's version, and a hand-kept copy of `[workspace.package] version` in
# the root `Cargo.toml`, which carries the argument for the number. maturin
# reads it from here rather than from `crates/tf_tree_py/Cargo.toml`, so this is
# the one users see — but the two must agree, because a wheel and a crate that
# disagree about their version are two artifacts nobody can pair up.
#
# `0.0.1` does not mean to Python what it means to cargo. PEP 440 has no
# equivalent of cargo's rule that every `0.0.x` is incompatible with every
# other, so `pip install -U transform_tree` will move a user from `0.0.1` to `0.0.2`
# without being asked twice. The wheel's compatibility promise is therefore
# written down — in `CHANGELOG.md` and `SUPPORT.md` — rather than encoded in
# the number, and it is the same promise the crates make: none.
version = "0.0.2"
description = "A transform tree engine — faster and more scalable than ROS tf2"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Noé Fontana", email = "noe.fontana.pro@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2.2.6"]

[dependency-groups]
# Floors from `docs/PHASE3.md` §10.1. Each is there for a reason recorded in
# that section, not merely because it is current.
dev = ["maturin>=1.14.1,<2.0", "pytest>=9.1.1", "ruff>=0.16.2", "pyright>=1.1.411"]

[tool.maturin]
manifest-path = "crates/tf_tree_py/Cargo.toml"
module-name = "tf_tree._core"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true
# **The sdist declares these and would not ship them.** maturin auto-detects
# root `LICENSE*` / `NOTICE` for PEP 639 and writes them into PKG-INFO as
# `License-File:`, but its sdist file selection is driven by the cargo package
# rules and never picks up files at the *workspace* root — so the tarball's root
# held only Cargo.toml, PKG-INFO, pyproject.toml and README.md. PyPI validates
# the pair and refuses the upload:
#
#   400 License-File LICENSE-APACHE does not exist in distribution
#
# It rejected the 0.0.2 sdist after the eleven wheels had already gone up, which
# is why that release has wheels and no source distribution. The wheels were
# never affected — only the sdist selection is.
include = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv", "target", "dist"]

[tool.ruff.format]
# ruff 0.16 formats Python code blocks inside Markdown *by default*, and
# `docs/` is this project's contract — its fenced blocks are line-broken to
# make an argument and sometimes elided with `...`. See PHASE3 §10.1.
exclude = ["**/*.md"]

[tool.ruff.lint]
# Explicit, because ruff 0.16 raised the default set from 59 rules to 413 and
# an implicit set would change under us on every upgrade (PHASE3 §10.1).
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.pytest.ini_options]
minversion = "9.1"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests/python"]

[tool.pyright]
include = ["python"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
# Without these pyright resolves nothing from the venv and reports every numpy
# type as unknown — 12 errors that look like stub bugs and are not.
venvPath = "."
venv = ".venv"
# The extension is `.so` + `.pyi`; pyright must read the stub, not try to
# introspect the binary.
stubPath = "python"
