[workspace]
resolver = "2"
members = [
    "crates/rust-python-template-core",
    "crates/rust-python-template-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoeFontana/rust-python-template"
homepage = "https://github.com/NoeFontana/rust-python-template"
authors = ["Noé Fontana <noe.fontana.pro@gmail.com>"]
keywords = []
categories = []

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.dependencies]
rust-python-template-core = { path = "crates/rust-python-template-core" }
thiserror = "2"
pyo3 = { version = "0.28", default-features = false, features = ["macros", "abi3-py310"] }
numpy = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"

[profile.dev]
opt-level = 0

[profile.bench]
lto = "thin"
codegen-units = 1
