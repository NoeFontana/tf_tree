[workspace]
resolver = "2"
members = [
    "crates/tf_tree_math",
    "crates/tf_tree_arena",
    "crates/tf_tree_core",
    "crates/tf_tree_ipc",
    "crates/tf_tree",
    "crates/tf_tree_bench",
    "crates/tf_tree_cli",
    "crates/tf_tree_bridge",
    "crates/tf_tree_ingest",
    "crates/tf_tree_c",
    "xtask",
]
# `tf_tree_tf2_sys` (ROS 2) and `tf_tree_py` (libpython) are excluded so
# `cargo build --workspace` works on every host; `just py-*` builds the latter.
exclude = [
    "crates/tf_tree_py","crates/tf_tree_tf2_sys"]

[workspace.package]
# 0.0.x: every release may break every other (`CHANGELOG.md`; `SUPPORT.md` MSRV policy).
version = "0.0.5"
edition = "2021"
# 1.87 is forced by `ruzstd 0.9.0` (pure-Rust zstd for `tf_tree_ingest`, `docs/PHASE2.md` §2).
# The decoder's 100 MiB cap bounds its window, not its output; output is bounded by
# `IngestOptions::max_chunk_uncompressed_bytes` and `max_chunk_expansion_ratio`.
# The `msrv` job reads this field. Policy: `SUPPORT.md`.
rust-version = "1.87"
# Publishable crates carry `LICENSE-MIT`, `LICENSE-APACHE` and `NOTICE` as symlinks
# to the files beside this manifest; `cargo package` dereferences them. Publish from
# Linux: a Windows checkout without `core.symlinks` would ship the link text.
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoeFontana/tf_tree"
homepage = "https://github.com/NoeFontana/tf_tree"
authors = ["Noé Fontana <noe.fontana.pro@gmail.com>"]
keywords = ["robotics", "tf", "transform", "se3", "ros"]
categories = ["science::robotics", "no-std"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
# 0007 rule 3: every `unsafe` block has a `// SAFETY:` comment. The lint checks
# presence only; it goes directly above the block (inside a wrapping macro, or on
# the `match` arm). `tf_tree_py` and `tf_tree_tf2_sys` repeat it.
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
# Registers `--cfg loom` so `-D warnings` accepts it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.dependencies]
# Intra-workspace crates.
tf_tree_math = { path = "crates/tf_tree_math", version = "0.0.5" }
tf_tree_arena = { path = "crates/tf_tree_arena", version = "0.0.5" }
# `shm` (`docs/PHASE2.md` §2): `linux_raw` backend, no libc crate, no C build.
# rustix is used only by `tf_tree_ipc`, for `fcntl(F_OFD_*)` (`crates/tf_tree_ipc/src/ofd.rs`).
libc = "0.2"
rustix = { version = "1.1", default-features = false, features = ["mm", "fs", "std"] }
# `default-features = false` is load-bearing: a workspace dependency carries its own
# defaults, so without it `--no-default-features` downstream still enables
# `tf_tree_core/default` and the `counters` switch (`docs/PHASE5.md` §5.5) never switches.
tf_tree_core = { path = "crates/tf_tree_core", version = "0.0.5", default-features = false }
tf_tree_ipc = { path = "crates/tf_tree_ipc", version = "0.0.5" }
tf_tree = { path = "crates/tf_tree", version = "0.0.5", default-features = false }
# publish = false crates. `default-features = false` for the same reason as above.
tf_tree_bench = { path = "crates/tf_tree_bench", default-features = false }
tf_tree_bridge = { path = "crates/tf_tree_bridge" }
# `docs/PHASE5.md` §3. The CLI decides whether the engine counts.
tf_tree_ingest = { path = "crates/tf_tree_ingest", default-features = false }
# no_std numeric + POD casting (the entire core dependency budget, plus blake3).
libm = "0.2"
bytemuck = { version = "1", features = ["derive"] }
blake3 = { version = "1", default-features = false }
# std-side facade / tooling only.
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# dev / bench only.
proptest = "1"
loom = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }
# `tf_tree_bench`'s regression gate reads the committed `results.json` baseline.
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"

[profile.dev]
opt-level = 0

[profile.bench]
lto = "thin"
codegen-units = 1

# Release codegen with debuginfo, so profilers attribute to source lines (`fold_at`
# inlines the whole sampling chain).
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

# An embedder's `cargo build --release` (`docs/PHASE5.md` §9.2, `docs/API.md` §2.3 item 3):
# every cargo default is spelled out so edits to `[profile.release]` do not change it.
# `crates/tf_tree_bench/src/embed.rs` has a test that reads these values back.
[profile.embedder]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
debug = false
strip = "none"
debug-assertions = false
overflow-checks = false
incremental = false
panic = "unwind"
