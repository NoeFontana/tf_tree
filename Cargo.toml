[workspace]
resolver = "2"
members = [
    "crates/tf_tree_math",
    "crates/tf_tree_arena",
    "crates/tf_tree_core",
    "crates/tf_tree",
    "crates/tf_tree_bench",
    "crates/tf_tree_cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoeFontana/tf_tree"
homepage = "https://github.com/NoeFontana/tf_tree"
authors = ["Noé Fontana <noe.fontana.pro@gmail.com>"]
keywords = ["robotics", "tf", "transform", "se3", "ros"]
categories = ["science::robotics", "no-std"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
# `--cfg loom` is a first-class build mode for tf_tree_core's concurrency tests;
# registering it workspace-wide keeps `-D warnings` (unexpected_cfgs) happy and
# lets every crate inherit lints with `[lints] workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.dependencies]
# Intra-workspace crates (version pinned so publishable crates carry a real
# requirement, not a path wildcard).
tf_tree_math = { path = "crates/tf_tree_math", version = "0.1.0" }
tf_tree_arena = { path = "crates/tf_tree_arena", version = "0.1.0" }
tf_tree_core = { path = "crates/tf_tree_core", version = "0.1.0" }
tf_tree = { path = "crates/tf_tree", version = "0.1.0" }
# no_std numeric + POD casting (the entire core dependency budget, plus blake3).
libm = "0.2"
bytemuck = { version = "1", features = ["derive"] }
blake3 = { version = "1", default-features = false }
# std-side facade / tooling only.
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# dev / bench only.
proptest = "1"
loom = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"

[profile.dev]
opt-level = 0

[profile.bench]
lto = "thin"
codegen-units = 1
