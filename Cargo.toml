[workspace]
resolver = "2"
members = [
    "crates/tf_tree_math",
    "crates/tf_tree_arena",
    "crates/tf_tree_core",
    "crates/tf_tree_ipc",
    "crates/tf_tree",
    "crates/tf_tree_bench",
    "crates/tf_tree_cli",
    "crates/tf_tree_bridge",
    "crates/tf_tree_ingest",
    "crates/tf_tree_c",
    "xtask",
]
# `tf_tree_tf2_sys` (ROS 2) and `tf_tree_py` (libpython) are excluded so
# `cargo build --workspace` works on every host.
exclude = [
    "crates/tf_tree_py","crates/tf_tree_tf2_sys"]

[workspace.package]
# 0.0.x: every release may break every other (`SUPPORT.md`).
version = "0.0.6"
edition = "2021"
# 1.87 is forced by `ruzstd 0.9.0` (`tf_tree_ingest`). The `msrv` job reads this
# field; policy in `SUPPORT.md`.
rust-version = "1.87"
# Publishable crates symlink `LICENSE-*` and `NOTICE`; publish from Linux.
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoeFontana/tf_tree"
homepage = "https://github.com/NoeFontana/tf_tree"
authors = ["Noé Fontana <noe.fontana.pro@gmail.com>"]
keywords = ["robotics", "tf", "transform", "se3", "ros"]
categories = ["science::robotics", "no-std"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
# 0007 rule 3: every `unsafe` block has a `// SAFETY:` comment directly above it.
# `tf_tree_py` and `tf_tree_tf2_sys` repeat it.
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
# Registers `--cfg loom` so `-D warnings` accepts it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.dependencies]
# Intra-workspace crates.
tf_tree_math = { path = "crates/tf_tree_math", version = "0.0.6" }
tf_tree_arena = { path = "crates/tf_tree_arena", version = "0.0.6" }
# `shm` (`docs/PHASE2.md` §2): `linux_raw` backend, no C build; used only by `tf_tree_ipc`.
libc = "0.2"
rustix = { version = "1.1", default-features = false, features = ["mm", "fs", "std"] }
# `default-features = false` is load-bearing: without it `--no-default-features`
# downstream still enables `counters` (`docs/PHASE5.md` §5.5).
tf_tree_core = { path = "crates/tf_tree_core", version = "0.0.6", default-features = false }
tf_tree_ipc = { path = "crates/tf_tree_ipc", version = "0.0.6" }
tf_tree = { path = "crates/tf_tree", version = "0.0.6", default-features = false }
# publish = false crates; `default-features = false` as above.
tf_tree_bench = { path = "crates/tf_tree_bench", default-features = false }
tf_tree_bridge = { path = "crates/tf_tree_bridge" }
# `docs/PHASE5.md` §3. The CLI decides whether the engine counts.
tf_tree_ingest = { path = "crates/tf_tree_ingest", default-features = false }
# no_std numeric + POD casting (the entire core dependency budget, plus blake3).
libm = "0.2"
bytemuck = { version = "1", features = ["derive"] }
blake3 = { version = "1", default-features = false }
# std-side facade / tooling only.
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# dev / bench only.
proptest = "1"
loom = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"

[profile.dev]
opt-level = 0

[profile.bench]
lto = "thin"
codegen-units = 1

# Release codegen with debuginfo for profilers.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

# An embedder's `cargo build --release` (`docs/PHASE5.md` §9.2, `docs/API.md` §2.3):
# every default spelled out; `crates/tf_tree_bench/src/embed.rs` tests these values.
[profile.embedder]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
debug = false
strip = "none"
debug-assertions = false
overflow-checks = false
incremental = false
panic = "unwind"
