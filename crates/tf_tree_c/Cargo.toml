[package]
name = "tf_tree_c"
description = "C ABI for tf_tree — docs/PHASE4.md §3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# **Not published, and the reason is the artifact shape, not maturity alone.**
# What a C or C++ consumer needs is the generated headers plus a built
# `staticlib`/`cdylib` — none of which arrives through `cargo add`. Publishing
# would put a crate on crates.io whose only Rust-visible surface (`rlib`) exists
# for this repository's own integration tests. It also carries an ABI version
# (`docs/PHASE4.md` §3.1) that is pre-1.0 and still moving; an ABI on crates.io
# is a promise, and this one is not ready to make. Distribution is release
# artifacts plus the CMake package, per `docs/PHASE5.md` §10.
publish = false

[lib]
# `staticlib` and `cdylib` are the shipped artifacts; `rlib` exists so the
# integration tests in `tests/` can link the crate as a normal Rust dependency
# and drive the same entry points a C caller would.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tf_tree = { workspace = true }

[features]
# Test-only hook that forces a panic inside an `extern "C"` body, so §6.1's
# "the process must survive" claim is testable rather than asserted.
test-hooks = []
# Pass through to tf_tree: tft_tree_open needs the shared-memory rendezvous.
shm = ["tf_tree/shm"]

[lints]
workspace = true

# Needs the fixture constructor, so it cannot build in a default `--all-targets`
# pass. Declaring it here is what keeps `just lint` (which builds every target
# with no features) from failing on it.
[[example]]
name = "abi_cost"
required-features = ["test-hooks"]
