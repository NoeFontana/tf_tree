[package]
name = "tf_tree_c"
description = "C ABI for tf_tree — docs/PHASE4.md §3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Not published: C consumers need the headers plus a built `staticlib`/`cdylib`,
# which `cargo add` does not deliver, and the ABI version (`docs/PHASE4.md` §3.1)
# is pre-1.0. Distribution is release artifacts plus the CMake package
# (`docs/PHASE5.md` §10).
publish = false

[lib]
# `rlib` exists only so `tests/` can drive the entry points a C caller would.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# `unstable` (`docs/API.md` §2.6): `src/unstable.rs` reads arena tables through
# `Tree::arena_view`. The stable header needs nothing from it.
tf_tree = { workspace = true, features = ["unstable"] }
# Optional, behind `bridge`: weight a transform-only C caller should not link.
tf_tree_bridge = { workspace = true, optional = true }

[features]
# Test-only: forces a panic inside an `extern "C"` body (§6.1).
test-hooks = []
# `tft_tree_open` needs the shared-memory rendezvous.
shm = ["tf_tree/shm"]
# The ingest-bridge seam (`docs/PHASE4.md` §5); the *unstable* tier of §3.1.
bridge = ["dep:tf_tree_bridge"]

[lints]
workspace = true

# Needs the fixture constructor; keeps a no-feature `--all-targets` build green.
[[example]]
name = "abi_cost"
required-features = ["test-hooks"]

# Same reason: drives the default-off §5 seam.
[[example]]
name = "bridge_cost"
required-features = ["bridge"]

# The second process in `tests/bridge_shared.rs` (`docs/decisions/0015`). Needs
# `shm`, not `bridge`: it is an ordinary `tf_tree` consumer and links no C ABI.
[[bin]]
name = "bridge_reader"
required-features = ["shm"]

# The owner `tests/recovery.rs` kills (`docs/decisions/0044`); must be a process.
[[bin]]
name = "arena_owner"
required-features = ["shm"]
