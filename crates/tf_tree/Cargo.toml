[package]
name = "tf_tree"
description = "std facade for the tf_tree transform engine: ergonomic builder, lookups, and Display errors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["counters"]
# Passthrough to `tf_tree_core` (`docs/PHASE5.md` §5.5). Default-on; turning it
# off removes the counter code from the engine, and the arena regions stay
# (D34) so the layout hash does not fork.
counters = ["tf_tree_core/counters"]
# Phase 2 shared memory: `TreeBuilder::build_shared` / `Tree::attach_shared`.
# Linux-only and off by default — the single-process build must not grow a
# syscall dependency it never uses.
shm = ["tf_tree_arena/shm", "dep:tf_tree_ipc"]
# **`docs/API.md` §2.6's Rust mirror of `tf_tree_unstable.h`.** Off by default,
# and the *documentation of this feature is the waiver*: `tf_tree::unstable::*`
# and `Tree::arena_view` exist only when it is on, and nothing reachable through
# it is covered by semver. C spells the same split as a second header plus
# `#define TFT_ENABLE_UNSTABLE` (`docs/PHASE4.md` §3.1); a Cargo feature is the
# nearest thing Rust has, because it is the only mechanism a *caller* has to
# write down.
#
# Turning it on inside this workspace is not a cost-free convenience: every
# consumer that does so is a consumer whose build would break at a patch
# release, and the list should stay short. Today it is **four**: `tf_tree_cli`
# (renders arena tables), `tf_tree_c` (its own unstable header's introspection
# tier), `tf_tree_bench` (measures the arena) and `tf_tree_py` (`offline.rs`
# walks a frozen `.tft`'s tables). `just stable-tier-check` reads that list back
# out of the `[dependencies]` entries and fails if this comment or
# `docs/API.md` §6 row 4 disagrees with it — an earlier revision of this
# paragraph said three, and nothing noticed.
#
# **This crate's own default feature set with `unstable` off — `counters` on,
# nothing else — is compiled by `just stable-tier-check` and by no other
# recipe.** `cargo build --workspace` unifies the four consumers' features into
# the facade, so `--workspace`, `just build`, `just lint` and
# `cargo nextest run --workspace` all compile `tf_tree` *with* `unstable`; only a
# `-p tf_tree` selection does not. (`just ingest-check` compiles the facade
# without `unstable` too, but with *no* features, because
# `[workspace.dependencies]` sets `default-features = false` — a third
# configuration, not the one `cargo add tf_tree` produces.) That recipe is the
# gate, and CI runs it as its own job.
unstable = []
# A single injection point inside `Tree::claim`, between the arena CAS and the
# lease `SETLK` (`docs/decisions/0005` §5). Off by default and absent from the
# API entirely unless enabled: the window it exposes is one syscall wide and
# there is no other way to place a reaper inside it deterministically, but a
# published hook that runs arbitrary code mid-claim is not something a shipped
# build should carry. Enabled by `just shm-rendezvous`.
test-hooks = []

[dependencies]
tf_tree_core.workspace = true
tf_tree_math.workspace = true
tf_tree_arena.workspace = true
thiserror.workspace = true

# The rendezvous half of Phase 2 (`docs/decisions/0005`). This crate owns the
# composition because `open()` must return a `Tree`, whose constructor surface
# is private — every alternative pays for the seam by widening that API. Gated
# on `shm` *and* Linux, like the mapping it pairs with.
[target.'cfg(target_os = "linux")'.dependencies]
tf_tree_ipc = { workspace = true, optional = true }

[dev-dependencies]
# **A dev-dependency on itself, so `unstable` is on for `cargo test` and off for
# `cargo build`.** Five test binaries read the arena back through
# `Tree::arena_view`, which the `unstable` feature now gates —
# `tests/counters.rs` (6 call sites), `tests/frozen.rs` (3),
# `tests/behavior.rs` (2), `tests/construction.rs` (2) and
# `tests/owned_writer.rs` (1), fourteen in total. Without this line
# they would need `required-features = ["unstable"]` and would silently leave
# `just test` — `cargo nextest run --workspace` builds default features, and a
# test in no gate is worth nothing. Cargo unifies a dev-dependency's features
# into the package's own build when a test target is built, and dev-dependencies
# are not built at all for `cargo build`, so this turns the feature on exactly
# for the test profile.
#
# The cost is stated rather than hidden, and the first statement of it was
# wrong: **no host recipe compiles this crate's test targets with `unstable`
# off, and `just build` does not compile the *library* that way either** —
# `cargo build --workspace` unifies the feature in from `tf_tree_cli`,
# `tf_tree_c` and `tf_tree_bench`. `just stable-tier-check` is what compiles it,
# with `-p tf_tree --lib` under three feature sets, and its comment records the
# mutation that proves it catches what `--workspace` does not.
#
# So: the library in the default tier is gated; this crate's *test targets* in
# that tier are not, and cannot be while this line stands. Moving those
# assertions behind `#[cfg(feature = "unstable")]` and deleting this line is the
# alternative, and it is a real one — it would let `cargo nextest run -p tf_tree`
# run the default tier — but it trades a compile-time guarantee for a set of
# assertions that silently stop running if a `cfg` is misspelled.
tf_tree = { path = ".", features = ["unstable"] }
# The rendezvous tests probe the lock file directly, from outside the tree.
tf_tree_ipc = { workspace = true }
proptest.workspace = true

# The rendezvous is a between-processes claim, so `tests/rendezvous.rs` needs a
# real second process rather than a thread.
[[bin]]
name = "rendezvous_child"
required-features = ["shm"]

[[test]]
name = "rendezvous"
required-features = ["shm"]

# `docs/PHASE5.md` §2. The frozen backend is Linux-only and behind `shm`, like
# the mapping it reuses.
[[test]]
name = "frozen"
required-features = ["shm"]
