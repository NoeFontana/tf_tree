[package]
name = "tf_tree"
description = "std facade for the tf_tree transform engine: ergonomic builder, lookups, and Display errors."
# Per-crate front page for crates.io; see `tf_tree_math`'s manifest for why this
# is not inherited from the workspace. This is the one of the five that a
# stranger arrives at first, so it is the one that carries a runnable example
# and the "not tf2, not a fork, not affiliated with ROS" sentence.
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
# **Drops the inherited `no-std`, which is false of this crate.** This is the
# `std` facade — `Vec`, `Arc`, `std::fs`, a thread-local plan cache. The
# `no_std` half of the project is `tf_tree_core` / `tf_tree_arena` /
# `tf_tree_math`, which keep the slug. One accurate category beats two where one
# of them sends a `no_std` embedder to a crate that cannot build for them.
categories = ["science::robotics"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["counters"]
# Passthrough to `tf_tree_core` (`docs/PHASE5.md` §5.5). Default-on; turning it
# off removes the counter code from the engine, and the arena regions stay
# (D34) so the layout hash does not fork.
counters = ["tf_tree_core/counters"]
# Phase 2 shared memory: `TreeBuilder::build_shared` / `Tree::attach_shared`.
# Linux-only and off by default — the single-process build must not grow a
# syscall dependency it never uses.
shm = ["tf_tree_arena/shm", "dep:tf_tree_ipc"]
# **`docs/API.md` §2.6's Rust mirror of `tf_tree_unstable.h`.** Off by default,
# and the *documentation of this feature is the waiver*: `tf_tree::unstable::*`
# and `Tree::arena_view` exist only when it is on, and nothing reachable through
# it is covered by semver. C spells the same split as a second header plus
# `#define TFT_ENABLE_UNSTABLE` (`docs/PHASE4.md` §3.1); a Cargo feature is the
# nearest thing Rust has, because it is the only mechanism a *caller* has to
# write down.
#
# Turning it on inside this workspace is not a cost-free convenience: every
# consumer that does so is a consumer whose build would break at a patch
# release, and the list should stay short. Today it is **four**: `tf_tree_cli`
# (renders arena tables), `tf_tree_c` (its own unstable header's introspection
# tier), `tf_tree_bench` (measures the arena) and `tf_tree_py` (`offline.rs`
# walks a frozen `.tft`'s tables). `just stable-tier-check` reads that list back
# out of the `[dependencies]` entries and fails if this comment or
# `docs/API.md` §6 row 4 disagrees with it — an earlier revision of this
# paragraph said three, and nothing noticed.
#
# **This crate's own default feature set with `unstable` off — `counters` on,
# nothing else — is what `just stable-tier-check` exists to compile.**
# `cargo build --workspace` unifies the four consumers' features into the facade,
# so `--workspace`, `just build`, `just lint` and `cargo nextest run --workspace`
# all compile `tf_tree` *with* `unstable`; only a `-p tf_tree` selection does not.
# (`just ingest-check` compiles the facade without `unstable` too, but with *no*
# features, because `[workspace.dependencies]` sets `default-features = false` —
# a third configuration, not the one `cargo add tf_tree` produces.) That recipe
# is the gate, and CI runs it as its own job.
#
# It used to be the *only* recipe that reached this configuration, and since
# 0.0.1 it is not: deleting the self-dev-dependency below means every `-p
# tf_tree` selection now compiles the default tier, `just miri`'s
# `-p tf_tree --lib --test owned_writer` included. `stable-tier-check` is still
# the gate — it is the one that names the configuration on purpose, checks the
# `shm` and no-default-features variants beside it, and renders the tier's
# rustdoc — but it is no longer the only thing standing between this feature
# split and a compile error nobody sees.
unstable = []
# A single injection point inside `Tree::claim`, between the arena CAS and the
# lease `SETLK` (`docs/decisions/0005` §5). Off by default and absent from the
# API entirely unless enabled: the window it exposes is one syscall wide and
# there is no other way to place a reaper inside it deterministically, but a
# published hook that runs arbitrary code mid-claim is not something a shipped
# build should carry. Enabled by `just shm-rendezvous`.
test-hooks = []

[dependencies]
tf_tree_core.workspace = true
tf_tree_math.workspace = true
tf_tree_arena.workspace = true
thiserror.workspace = true

# The rendezvous half of Phase 2 (`docs/decisions/0005`). This crate owns the
# composition because `open()` must return a `Tree`, whose constructor surface
# is private — every alternative pays for the seam by widening that API. Gated
# on `shm` *and* Linux, like the mapping it pairs with.
[target.'cfg(target_os = "linux")'.dependencies]
tf_tree_ipc = { workspace = true, optional = true }

[dev-dependencies]
# **There is deliberately no dev-dependency on this crate itself here, and the
# history is kept because the trick is an attractive one.** Until 0.0.1 this
# section opened with `tf_tree = { path = ".", features = ["unstable"] }`, whose
# whole job was to turn `unstable` on for `cargo test` and leave it off for
# `cargo build`: cargo unifies a dev-dependency's features into the package's
# own build when a test target is built, and builds no dev-dependency at all for
# `cargo build`. That kept the fourteen `Tree::arena_view` call sites in
# `tests/{counters,frozen,behavior,construction,owned_writer}.rs` compiling
# without `required-features = ["unstable"]`, which would have dropped those
# targets out of `cargo nextest run --workspace` entirely.
#
# **What killed it is that the line does not survive publication, and that was
# measured rather than reasoned about.** It is path-only with no `version`, so
# `cargo package` strips it from the generated manifest — correctly, since a
# self-dependency at a version cannot resolve on the release that first
# publishes it. The tarball therefore shipped twelve test targets with their
# `unstable` switch removed: extracting `tf_tree-0.0.1.crate`, pointing the four
# engine deps at this workspace with `[patch.crates-io]` and building each
# target gave a clean `cargo build`, seven targets compiling, two (`frozen`,
# `rendezvous`) correctly skipped by their own `required-features`, and three —
# `behavior`, `construction`, `counters` — failing with
# `error[E0599]: no method named `arena_view` found for struct `Tree``. Nothing
# in the publish path notices: crates.io does not build tests and `cargo
# package`'s verify step compiles the lib and bins only, which is why all five
# crates verify green. The cost lands on whoever runs `cargo test` on the
# tarball, in practice a distribution packager.
#
# **What replaced it: `#[cfg(feature = "unstable")]` at the call sites.** A test
# target is part of this package, so `feature = "unstable"` resolves against the
# crate's own feature set with nothing declared here at all. `tests/counters.rs`
# is gated whole (every test in it reads a counter through the view);
# `behavior.rs`, `construction.rs` and `frozen.rs` gate one test each; and
# `behavior.rs`'s `span_names_the_edge_that_has_never_published` gates only the
# assertion that resolves an `EdgeId` back to its frame pair, so the rest of it
# runs in both tiers. `owned_writer.rs` needed no gate: it now asks
# `OwnedWriter::edge` for the id it was deriving from a topology read, which is
# the same fact on the stable tier.
#
# **This also fixes the second cost the old comment recorded**, which was that
# no recipe could compile these test targets with `unstable` off while that line
# stood. `cargo nextest run -p tf_tree` now does, and it is the shape
# `cargo test` on the tarball gets. The price is the one the old comment named
# as the objection: a compile-time guarantee traded for `cfg`s that would
# silently stop running if misspelled. That is what `just stable-tier-check`'s
# `[dev-dependencies]` scan now guards from the other side — it asserts this
# section does *not* re-acquire the self-dependency — and what the test-count
# comparison in the commit that made this change checked directly: 825 tests
# under `--workspace` before and after, 77 under `-p tf_tree --lib --tests`
# before against 70 after with the feature off and 77 with it on.
# The rendezvous tests probe the lock file directly, from outside the tree.
tf_tree_ipc = { workspace = true }
proptest.workspace = true

# The rendezvous is a between-processes claim, so `tests/rendezvous.rs` needs a
# real second process rather than a thread.
[[bin]]
name = "rendezvous_child"
required-features = ["shm"]

[[test]]
name = "rendezvous"
required-features = ["shm"]

# `docs/PHASE5.md` §2. The frozen backend is Linux-only and behind `shm`, like
# the mapping it reuses.
[[test]]
name = "frozen"
required-features = ["shm"]
