[package]
name = "tf_tree"
description = "std facade for the tf_tree transform engine: ergonomic builder, lookups, and Display errors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Phase 2 shared memory: `TreeBuilder::build_shared` / `Tree::attach_shared`.
# Linux-only and off by default — the single-process build must not grow a
# syscall dependency it never uses.
shm = ["tf_tree_arena/shm"]

[dependencies]
tf_tree_core.workspace = true
tf_tree_math.workspace = true
tf_tree_arena.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
