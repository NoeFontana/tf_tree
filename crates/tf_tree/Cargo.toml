[package]
name = "tf_tree"
description = "std facade for the tf_tree transform engine: ergonomic builder, lookups, and Display errors."
# Per-crate crates.io front page (see `tf_tree_math`'s manifest).
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
# Drops the inherited `no-std`: this is the `std` facade.
categories = ["science::robotics"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["counters"]
# Passthrough to `tf_tree_core` (`docs/PHASE5.md` §5.5).
counters = ["tf_tree_core/counters"]
pure-hash = ["tf_tree_core/pure-hash"]
# `docs/PHASE2.md` §11.3's fault injection; arms `crate::CRASH_SITES` too.
crash-points = ["tf_tree_core/crash-points"]
# `TreeBuilder::build_shared` / `Tree::attach_shared`. Linux-only.
shm = ["tf_tree_arena/shm", "dep:tf_tree_ipc"]
# `docs/API.md` §6's Rust mirror of `tf_tree_unstable.h` (`docs/PHASE4.md` §3.1).
# Enabling is the waiver: nothing behind it is covered by semver.
#
# Enabling consumers, checked by `just stable-tier-check` against this comment and
# `docs/API.md` §6 row 4: `tf_tree_cli`, `tf_tree_c`, `tf_tree_bench`, `tf_tree_py`.
unstable = []
# `#[doc(hidden)]` test seams: `CLAIM_WINDOW_HOOK` (`docs/decisions/0005` §5) and
# `reclamation_verdict_for_test` (`docs/decisions/0028` step 2). Run by `just shm-rendezvous`.
test-hooks = []

[dependencies]
tf_tree_core.workspace = true
tf_tree_math.workspace = true
tf_tree_arena.workspace = true
thiserror.workspace = true

# The rendezvous (`docs/decisions/0005`); gated on `shm` and Linux.
[target.'cfg(target_os = "linux")'.dependencies]
tf_tree_ipc = { workspace = true, optional = true }

[dev-dependencies]
# No self dev-dependency: `cargo package` strips it. Tests gate `arena_view` call
# sites with `#[cfg(feature = "unstable")]` (`tests/feature_gates.rs`).
tf_tree_ipc = { workspace = true }
proptest.workspace = true

# `tests/rendezvous.rs`'s second process. Published, so the name is prefixed;
# `cargo install --features shm` writes it to `~/.cargo/bin` (`README.md`). It
# stays here because `env!("CARGO_BIN_EXE_…")` needs this package's executable.
[[bin]]
name = "tf_tree_rendezvous_child"
path = "src/bin/rendezvous_child.rs"
required-features = ["shm"]

[[test]]
name = "rendezvous"
required-features = ["shm"]

# `docs/PHASE5.md` §2; Linux-only, behind `shm`.
[[test]]
name = "frozen"
required-features = ["shm"]
