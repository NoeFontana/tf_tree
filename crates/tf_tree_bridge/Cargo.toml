[package]
name = "tf_tree_bridge"
description = "The ROS-independent half of the tf_tree ingest bridge — docs/PHASE4.md §5.4-§5.7, §5.9."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# **Not published because half the bridge does not exist.** This crate is the
# ROS-independent decision half; the `rclcpp` half is recorded as **BLOCKED** in
# `docs/PHASE4.md` §0.0 and §5.8 (the spec assumes a runtime edge declaration the
# engine does not have). A crate named `tf_tree_bridge` on crates.io would
# advertise a bridge that cannot currently bridge.
publish = false

# **A workspace member with no ROS dependency, and that is the design.**
#
# `docs/PHASE4.md` §0.0 says it outright: §5.4 (authority), §5.5 (clock), §5.6
# (frame names) and §5.7 (static semantics) are *pure functions*, and "a
# `TransformStamped`-shaped plain struct is legitimate" for them. So they live
# here, where `just test` and `just lint` see them on every host, rather than
# behind a container nobody runs on the normal development loop.
#
# `tf_tree_tf2_sys` is the counter-example and the reason this matters: it is
# excluded from the workspace because it needs ROS headers, and as a result it
# is the one crate carrying `unsafe` with no lint coverage — its own comment
# says so. The rclcpp shell (§5.8) will have the same problem. Everything that
# does not *have* to be over there belongs here.
# **One dependency, and it is not ROS.**
#
# §5.4-§5.7 are still decision functions over plain data and still need nothing.
# `config.rs` is the exception `docs/PHASE4.md` §5.8's amendment forces: the
# resolution it states is that the bridge takes its topology from a file *up
# front*, and a topology file that cannot produce a `TreeBuilder` is not that
# resolution — it is a data structure with a comment promising one. The
# `config -> TreeBuilder` mapping is the engine operation `Action::DeclareStatic`
# never had.
#
# The split this crate exists for is intact, because it was never "no
# dependencies": it is "nothing that only builds where ROS is installed". The
# facade is a workspace member with no ROS, no syscalls (`shm` is off) and
# `#![forbid(unsafe_code)]`, so `just test` and `just lint` still cover every
# line here on every host — which is the property that matters and the reason
# `tf_tree_tf2_sys` is the cautionary tale in the comment above.
[dependencies]
tf_tree.workspace = true

[lints]
workspace = true
