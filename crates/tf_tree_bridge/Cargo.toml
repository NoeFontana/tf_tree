[package]
name = "tf_tree_bridge"
description = "The ROS-independent half of the tf_tree ingest bridge — docs/PHASE4.md §5.4-§5.7, §5.9."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Not published: the `rclcpp` half is BLOCKED (`docs/PHASE4.md` §0.0, §5.8).
publish = false

# No ROS dependency: §5.4-§5.7 are pure functions (`docs/PHASE4.md` §0.0), so
# `just test` and `just lint` cover them on every host. The one dependency is the
# `tf_tree` facade (no ROS, no syscalls, `forbid(unsafe_code)`), which `config.rs`
# needs to turn a topology file into a `TreeBuilder` (§5.8 amendment).
[dependencies]
tf_tree.workspace = true

# `unstable` for tests only (`docs/API.md` §2.6): `config.rs`'s
# `a_declared_rate_hz_reaches_the_arena_and_capacity_declares_nothing` reads
# `EdgeRecord::nominal_rate_mhz` through `Tree::arena_view`. Dev-only, so
# consumers are unaffected; `just stable-tier-check` found it missing.
[dev-dependencies]
tf_tree = { workspace = true, features = ["unstable"] }

[lints]
workspace = true
