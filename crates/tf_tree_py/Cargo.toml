# Not a workspace member (it links libpython), so metadata and lints are spelled
# out. The empty `[workspace]` keeps it its own root, including inside a git
# worktree. Built through `just py-*` (`docs/PHASE3.md` §10.1).
[workspace]

[package]
name = "tf_tree_py"
description = "PyO3 bindings for tf_tree (docs/PHASE3.md)"
# Hand-kept copy of `[workspace.package] version`. `tf_tree.__version__` reads
# this field, pip reads `pyproject.toml`'s; bump both together
# (`tests/python/test_version.py`, which runs under `just py-test`).
version = "0.0.6"
edition = "2021"
# Workspace floor, by hand (see the root `Cargo.toml`).
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoeFontana/tf_tree"
homepage = "https://github.com/NoeFontana/tf_tree"
authors = ["Noé Fontana <noe.fontana.pro@gmail.com>"]
# The wheel is the artifact (`docs/PHASE3.md` §10), not a crate.
publish = false

[lib]
# `cdylib` is the extension module; `rlib` so the crate's own tests can link it.
name = "_core"
crate-type = ["cdylib", "rlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# `docs/decisions/0007` rule 3, mirrored from the root manifest.
undocumented_unsafe_blocks = "deny"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

# Forwarded so `just py-cross-check` can `cargo check` the wheel for macOS and
# Windows (#180: `macos-15-intel` disappears in August 2027).
[features]
pure-hash = ["tf_tree/pure-hash"]

[dependencies]
# `unstable`: `offline.rs` walks a frozen `.tft` through `Tree::arena_view` (`docs/API.md` §2.6).
tf_tree = { path = "../tf_tree", version = "0.0.6", features = ["shm", "unstable"] }
tf_tree_core = { path = "../tf_tree_core", version = "0.0.6" }
tf_tree_math = { path = "../tf_tree_math", version = "0.0.6" }
# Topology config shared with `ros/tf_tree_ros` (`docs/decisions/0041`); nothing Linux-only.
tf_tree_bridge = { path = "../tf_tree_bridge" }
# Unconditional and without `shm`: the binding uses only `run` and `digest_file`
# (`docs/PHASE5.md` §3, `docs/decisions/0046`), and `py-cross-check` compiles it.
tf_tree_ingest = { path = "../tf_tree_ingest" }
# 0.29 is the floor for `abi3t` and free-threading (`docs/PHASE3.md` §10.1).
pyo3 = { version = "0.29", features = ["macros"] }
numpy = "0.29"

# The root profile does not apply here; thin LTO is needed to inline
# `tf_tree_core`'s batch kernel (51.7 -> 40.6 ns/sample at n=4096).
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"
