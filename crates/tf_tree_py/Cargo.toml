# Deliberately NOT a workspace member (see `exclude` in the root manifest): the
# extension links libpython, which `cargo build --workspace` cannot assume is
# present. Making it a member would break the normal development loop on every
# host without Python development files — the same reasoning as
# `tf_tree_tf2_sys` and ROS.
#
# Being outside the workspace also means it cannot use `field.workspace = true`
# inheritance, so the metadata and lints below are spelled out.
#
# Built and tested through `just py-*`, which point PyO3 at a uv-managed
# interpreter so the toolchain floors in `docs/PHASE3.md` §10.1 are what is
# actually used rather than whatever the host happens to ship.
# An empty table makes this crate its own workspace root, which is what the
# root manifest's `exclude` already intends. It has to be said here as well
# because `exclude` is a path relative to the root: inside a git worktree —
# `.claude/worktrees/<name>/crates/tf_tree_py` — cargo walks up, finds the
# *main* checkout's root manifest, sees a path that is not in its `exclude`
# list, and refuses with "current package believes it's in a workspace when it's
# not". Without this, `just py-compile` and `just py-test` cannot run in a
# worktree at all, which is where the bindings now get changed.
[workspace]

[package]
name = "tf_tree_py"
description = "PyO3 bindings for tf_tree (docs/PHASE3.md)"
# Outside the workspace, so this is a hand-kept copy of `[workspace.package]
# version` — the root `Cargo.toml` carries the argument for the number. It is
# tracked even though this crate is `publish = false`, because one version
# across the repository is what keeps the wheel, the crates and the CMake
# package describing the same commit.
#
# **It is not cosmetic here, and that is easy to miss**: `lib.rs` exports
# `tf_tree.__version__` as `env!("CARGO_PKG_VERSION")`, which is *this* field,
# while the version pip reports for the same wheel comes from
# `pyproject.toml`'s. Two manifests, one user-visible number each, and nothing
# compares them — so a bump applied to one and not the other ships a wheel whose
# `__version__` contradicts its own metadata.
version = "0.0.1"
edition = "2021"
# Tracks the workspace floor by hand: this crate is outside the workspace (it
# links libpython), so it cannot inherit `[workspace.package]`. See the note on
# `rust-version` in the root `Cargo.toml` for why the number is 1.87.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoeFontana/tf_tree"
homepage = "https://github.com/NoeFontana/tf_tree"
authors = ["Noé Fontana <noe.fontana.pro@gmail.com>"]
# The Rust crate is never published: it is the `_core` extension module, and the
# artifact users install is the PyPI wheel built by maturin (`docs/PHASE3.md`
# §10), not a crates.io entry. Publishing it would put a crate on crates.io that
# fails to build anywhere libpython is not where PyO3 expects it.
publish = false

[lib]
# `cdylib` is the extension module; `rlib` so the crate's own tests can link it.
name = "_core"
crate-type = ["cdylib", "rlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[dependencies]
# `"unstable"` — `docs/API.md` §2.6. `offline.rs` walks the frame and edge
# tables of a frozen `.tft` through `Tree::arena_view`, which is now the Rust
# unstable tier. The wheel is built and shipped from this workspace with the
# engine, so it is a consumer that cannot skew from it.
tf_tree = { path = "../tf_tree", version = "0.0.1", features = ["shm", "unstable"] }
tf_tree_core = { path = "../tf_tree_core", version = "0.0.1" }
tf_tree_math = { path = "../tf_tree_math", version = "0.0.1" }
# 0.29 is the floor: `abi3t` / `abi3t-py315` and the free-threading story do not
# exist below it (`docs/PHASE3.md` §10.1).
pyo3 = { version = "0.29", features = ["macros"] }
numpy = "0.29"

# Being outside the workspace means the root `[profile.release]` does not apply,
# and cargo's defaults are opt-level 3 with **no LTO and 16 codegen units**.
# That is not a small difference for this crate: the hot path is a call from the
# extension into `tf_tree_core`'s batch kernel, which only inlines across the
# crate boundary with LTO on. Measured at n=4096: 51.7 -> 40.6 ns/sample.
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"
