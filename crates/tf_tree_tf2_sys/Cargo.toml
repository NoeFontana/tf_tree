# Deliberately NOT a workspace member (see `exclude` in the root manifest): this
# crate only builds where ROS 2 is installed, so making it a member would break
# `cargo build --workspace` on every host without ROS — including CI and the
# normal development loop. It is reached only as an optional path dependency of
# `tf_tree_bench --features tf2`.
#
# Being outside the workspace also means it cannot use `field.workspace = true`
# inheritance, so the metadata and lints below are spelled out.
#
# An empty table makes that exclusion structural. `exclude` in the root manifest
# is a path *relative to that manifest*, so inside a git worktree —
# `.claude/worktrees/<name>/crates/tf_tree_tf2_sys` — cargo walks up, finds the
# main checkout's root manifest and refuses with "current package believes it's
# in a workspace when it's not". That breaks `cargo fmt --all`, which formats
# path dependencies too, so the whole `just lint` gate fails in any worktree.
[workspace]

[package]
name = "tf_tree_tf2_sys"
description = "FFI bridge to ROS 2 tf2::BufferCore, for the tf_tree differential and benchmark harnesses."
version = "0.2.0"
edition = "2021"
# Outside the workspace, so this cannot inherit `[workspace.package]
# rust-version` and has to repeat it. It is not free to differ: this crate path-
# depends on `tf_tree_math`, which declares 1.85, so a lower number here promised
# a build that never existed. CI's `msrv` job compares every hand-written
# `rust-version` in the repository against the workspace's, because a floor that
# nothing checks is a floor that drifts — which is the defect that produced this
# line's previous values of 1.83 and 1.85.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoeFontana/tf_tree"
homepage = "https://github.com/NoeFontana/tf_tree"
authors = ["Noé Fontana <noe.fontana.pro@gmail.com>"]
# The only edge in the repository that reaches ROS 2, and it links `libtf2`.
# Excluded from the workspace for the same reason it is unpublishable: it builds
# only where a ROS 2 install is present, so on crates.io it would fail for almost
# everyone who tried it.
publish = false
# Declares the native library this crate links, which is what lets `build.rs`
# publish metadata (`cargo:rpath=...`) to the build scripts of crates that
# depend on it. `cargo:rustc-link-arg` only reaches *this* package's own
# targets, so `tf_tree_bench`'s bench/test/bin binaries have to re-emit the
# rpath themselves — and this is how they learn where ROS was found.
links = "tf_tree_tf2_shim"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[dependencies]
tf_tree_math = { path = "../tf_tree_math", version = "0.2.0" }

[build-dependencies]
cc = "1"
