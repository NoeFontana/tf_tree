# Not a workspace member (root `exclude`): it builds only where ROS 2 is installed,
# and is reached only via `tf_tree_bench --features tf2`. The empty table below
# keeps it out of a parent workspace, e.g. inside a git worktree.
[workspace]

[package]
name = "tf_tree_tf2_sys"
description = "FFI bridge to ROS 2 tf2::BufferCore, for the tf_tree differential and benchmark harnesses."
# Hand-kept copy of `[workspace.package] version`; a stale number fails to resolve `tf_tree_math`.
version = "0.0.5"
edition = "2021"
# Hand-kept copy of the workspace floor; CI's `msrv` job compares it.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoeFontana/tf_tree"
homepage = "https://github.com/NoeFontana/tf_tree"
authors = ["Noé Fontana <noe.fontana.pro@gmail.com>"]
# Builds only with a ROS 2 install, so it is unpublishable.
publish = false
# Lets `build.rs` publish `cargo:rpath` to `tf_tree_bench`'s build script, which must re-emit it.
links = "tf_tree_tf2_shim"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# `docs/decisions/0007` rule 3; only the container-only `just tf2-check` runs it.
undocumented_unsafe_blocks = "deny"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
# `docs/decisions/0007` rules 1 and 4, `0048` D4: the unsafe posture lives here, not in
# `src/lib.rs`. `unsafe_op_in_unsafe_fn` is vacuous until this crate declares an `unsafe fn`.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
tf_tree_math = { path = "../tf_tree_math", version = "0.0.5" }

[build-dependencies]
cc = "1"
