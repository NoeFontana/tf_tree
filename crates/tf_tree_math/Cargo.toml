[package]
name = "tf_tree_math"
description = "no_std SE(3)/SO(3) and dual-quaternion math for the tf_tree transform engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
libm.workspace = true
bytemuck.workspace = true

[dev-dependencies]
proptest.workspace = true
# Force libm's soft-float paths in test/bench builds only: its default `arch`
# feature uses inline asm (e.g. x86 `sqrt`) that Miri cannot execute. Additive,
# affects only this crate's test binaries; the production build keeps the
# arch-accelerated path.
libm = { workspace = true, features = ["force-soft-floats"] }
