[package]
name = "tf_tree_math"
description = "no_std SE(3)/SO(3) and dual-quaternion math for the tf_tree transform engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Route libm through its soft-float paths. Needed **only** under Miri, whose
# interpreter cannot execute the inline asm (e.g. x86 `sqrt`) libm's default
# `arch` feature emits. `just miri` turns it on explicitly.
#
# This must not be a dev-dependency feature: cargo unifies dev-dependency
# features with the normal dependency whenever dev-deps are built, so
# `cargo build --workspace --all-targets`, `cargo nextest run` and any
# workspace-wide `cargo bench` would all compile libm — and with it every
# `sqrt`/`sin`/`cos` on the hot path — with soft floats.
miri-soft-float = ["libm/force-soft-floats"]

[dependencies]
libm.workspace = true
bytemuck.workspace = true

[dev-dependencies]
proptest.workspace = true
