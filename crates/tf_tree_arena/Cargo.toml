[package]
name = "tf_tree_arena"
description = "no_std+alloc pointer-free arena abstraction and layout math for tf_tree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Phase 2 shared memory. Linux-only (`memfd_create` + `F_ADD_SEALS`, kernel >=
# 3.17) and off by default so the crate stays `no_std + alloc` with a
# two-dependency budget everywhere else.
shm = ["dep:rustix"]

[dependencies]
bytemuck.workspace = true
# `docs/PHASE2.md` §2 names rustix specifically: raw syscalls with no libc crate
# and no C build step. `default-features = false` keeps it `no_std`.
rustix = { workspace = true, optional = true, features = ["rand"] }

[dev-dependencies]
proptest.workspace = true
