[package]
name = "tf_tree_arena"
description = "no_std+alloc pointer-free arena abstraction and layout math for tf_tree."
# Per-crate front page for crates.io; see `tf_tree_math`'s manifest for why this
# is not inherited from the workspace.
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
# Inherited unchanged, and `data-structures` was considered and rejected. It
# would be accurate — this *is* a pointer-free relocatable data structure — but
# it advertises a general-purpose arena to people who want one, and this crate's
# own README tells them to depend on `tf_tree` instead. A category is a
# recruitment channel, not a description.
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Phase 2 shared memory. Linux-only (`memfd_create` + `F_ADD_SEALS`, kernel >=
# 3.17) and off by default so the crate stays `no_std + alloc` with a
# two-dependency budget everywhere else.
shm = ["dep:rustix"]

[dependencies]
bytemuck.workspace = true
# `docs/PHASE2.md` §2 names rustix specifically: raw syscalls with no libc crate
# and no C build step. `default-features = false` keeps it `no_std`.
# `process` is for `getpid` alone, in `MappedArena`'s destructor: a fork child
# must not `munmap` a range it does not have (see `mapped.rs`).
rustix = { workspace = true, optional = true, features = ["rand", "process"] }

[dev-dependencies]
proptest.workspace = true
