[package]
name = "tf_tree_ipc"
description = "Zero-configuration rendezvous for tf_tree shared arenas: runtime-directory discovery, the OFD lock file, and the open() decision machine."
# Per-crate front page for crates.io (not inherited; see `tf_tree_math`).
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
# Overrides the workspace `no-std`, which is false here (files, sockets, `Arc`).
# `os::linux-apis` because the crate is `#![cfg(target_os = "linux")]`.
categories = ["science::robotics", "os::linux-apis"]

# No `[features]` today; keeps docs.rs aligned with `just doc` if one is added.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
# `docs/PHASE2.md` §2 names rustix; `process` is for `getuid`.
rustix = { workspace = true, features = ["process", "net", "event"] }
# Deviation from §2's "no libc crate" for `fcntl(F_OFD_*)` only; see `src/ofd.rs`.
libc.workspace = true

# Helper for the multi-process tests: a thread cannot be SIGKILLed out from
# under its locks. The bin is named for the crate because `cargo install`
# writes bin names into `~/.cargo/bin`. It still installs, deliberately:
# `required-features` leaves `CARGO_BIN_EXE_*` pointing at an unbuilt path
# (tests fail with `NotFound`), a self dev-dependency is stripped from the
# published manifest, and gating the tests drops them from `just test`.
[[bin]]
name = "tf_tree_ipc_child"
path = "src/bin/ipc_child.rs"
