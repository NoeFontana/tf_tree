[package]
name = "tf_tree_ipc"
description = "Zero-configuration rendezvous for tf_tree shared arenas: runtime-directory discovery, the OFD lock file, and the open() decision machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# `docs/PHASE2.md` §2 names rustix and nothing else: raw syscalls with no libc
# crate and no C build step. `process` is on top of the workspace default set
# for `getuid` (the `/tmp/tf_tree-<uid>` fallback and the same-user check).
rustix = { workspace = true, features = ["process"] }

# Helper for the multi-process tests. A thread cannot stand in for it: half of
# what this crate relies on is what the *kernel* does when a lock holder dies,
# and there is no way to SIGKILL a thread out from under its locks.
[[bin]]
name = "ipc_child"
path = "src/bin/ipc_child.rs"
