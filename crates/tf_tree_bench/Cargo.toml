[package]
name = "tf_tree_bench"
description = "Criterion benchmarks for tf_tree, including the tf2 comparison harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Harness, not a library (`docs/PHASE5.md` §9.3): nobody `cargo add`s it.
publish = false

[lints]
workspace = true

[features]
default = ["counters", "ingest-compression", "ingest-fixture"]
# Passthrough, so `counter_cost` can measure both sides of §5.5's switch from one crate.
counters = ["tf_tree/counters"]
# The zstd decoder `docs/PHASE5.md` §12 gate 5's corpus needs (rosbag2 and Foxglove write zstd
# chunks by default). A default-on feature, not a dependency feature, so `tf_tree_cli`'s edge
# (declared `default-features = false`) does not switch the reader:
# `tf_tree_cli::tests::the_cli_compression_feature_switches_the_reader`.
ingest-compression = ["tf_tree_ingest/compression"]
# The corpus writer for gate 5, a passthrough for the same reason: `tf_tree_ingest`'s `fixture`
# must not reach the shipped `tf_tree` binary's graph. `just ingest-check` asserts both directions.
ingest-fixture = ["tf_tree_ingest/fixture"]
# The `tf2::BufferCore` differential path. Needs ROS 2 and the FFI shim in `src/tf2.rs`; without
# them it fails to link.
tf2 = ["dep:tf_tree_tf2_sys"]
# Shared memory: needs `tf_tree`'s `shm` feature for `build_shared`/`attach_shared`.
shm = ["tf_tree/shm"]
# `docs/PHASE2.md` §11.4's random crash point armed in 10% of children. The children are this
# binary, so it must carry the sites; default-off like every fault-injection knob.
crash-points = ["tf_tree/crash-points", "tf_tree_core/crash-points"]
# `docs/decisions/0015`'s *Invariants to maintain*: `fork_child`'s fourth mode drives
# `tft_bridge_offer`, `tft_bridge_get_stats` and `tft_bridge_free` across `fork()`. The edge points
# from this `publish = false` crate to the C ABI, so no shipped crate gains a dependency.
# Implies `shm`: the property under test is a `MADV_DONTFORK` mapping.
bridge = ["shm", "dep:tf_tree_c"]
# `docs/PHASE5.md` §9.2's in-crate column. Default-off; `just embed-cost-check` compiles and tests it.
embed-probe = ["tf_tree_core/bench-probe"]
# The C ABI boundary probe: `abi_attached` needs `tft_test_plan_at_unguarded`. Its own feature so
# `bridge`, a shipped configuration (`docs/decisions/0015`), never carries test hooks.
abi-probe = ["bridge", "tf_tree_c/test-hooks"]

[dependencies]
# `unstable` (`docs/API.md` §2.6): the harnesses reach the arena through `Tree::arena_view`.
tf_tree = { workspace = true, features = ["unstable"] }
tf_tree_core.workspace = true
tf_tree_math.workspace = true
anyhow.workspace = true
# `fork()` and `waitpid()` for `src/bin/fork_child.rs`.
libc.workspace = true
# `fork_child` probes the claim lease from an independent open file description.
tf_tree_ipc.workspace = true
# Optional, outside the workspace on purpose (see the root manifest); pulled in only by `--features tf2`.
tf_tree_tf2_sys = { path = "../tf_tree_tf2_sys", optional = true }
# Optional, behind `bridge`, for `fork_child`'s fourth mode. The features are on the dependency
# because an unactivated optional dependency contributes none, so `--workspace` builds `tf_tree_c`
# with its own defaults. A path dependency: `tf_tree_c` is not in `[workspace.dependencies]`.
tf_tree_c = { path = "../tf_tree_c", optional = true, features = ["bridge", "shm"] }

# Reads the committed baseline (`src/baseline.rs`) only. A normal dependency because `[[bin]]`
# targets do not see dev-dependencies and the gate lives in `bench_report`.
serde_json.workspace = true

# `report::worse_entries` states the memory floor as arithmetic on the layout.
tf_tree_arena.workspace = true

# `docs/PHASE5.md` §12 gate 5 (`docs/decisions/0050`): `tf_tree_ingest::run` is timed on the corpus
# `tf_tree_ingest::fixture` writes. No `features` here: `fixture` arrives through `ingest-fixture`.
# A normal dependency because `[[bin]]` targets do not see dev-dependencies.
tf_tree_ingest.workspace = true

[dev-dependencies]
criterion.workspace = true

# Criterion benches (`harness = false`). Not the official go/no-go gate, which needs core-pinned
# hardware (`docs/PHASE1.md` §11.3).
[[bench]]
name = "lookup"
harness = false

[[bench]]
name = "query_mix"
harness = false

[[bench]]
name = "at_many"
harness = false

[[bench]]
name = "push"
harness = false

# Paired A/B for the `0036` receipt-time sampler; a delta against its own control, not a `bench_report` row.
[[bench]]
name = "push_sampler"
harness = false

[[bench]]
name = "read_scaling"
harness = false

# The head-to-head against ROS 2 tf2; `required-features` keeps ROS out of a normal `cargo bench`.
[[bench]]
name = "tf2_compare"
harness = false
required-features = ["tf2"]

# A binary because `docs/PHASE1.md` §11.2 wants p99.9 per lookup, not criterion's batch distribution.
[[bin]]
name = "tf2_scaling"
path = "src/bin/tf2_scaling.rs"
required-features = ["tf2"]

# Memory footprint and instructions-per-lookup; the tf2 modes are gated inside the binary.
[[bin]]
name = "footprint"
path = "src/bin/footprint.rs"

# The arena owner for `docker/tf2/native_ratio.sh`: serves the fixture over the rendezvous
# (`tft_tree_open` cannot create, D18).
[[bin]]
name = "native_arena"
path = "src/bin/native_arena.rs"
required-features = ["shm"]

# `docs/benchmarks/tf2.md`'s owed split: needs `shm` because the arm under test is `build_shared`.
[[bin]]
name = "arena_backing"
path = "src/bin/arena_backing.rs"
required-features = ["shm"]

# `docs/PHASE5.md` §12 gate 4: 16 workers sharing one `.tft`, total Pss within 1.2x of one worker.
# `shm` because the frozen backend is `#[cfg]`-ed on it; re-execs itself as the worker.
[[bin]]
name = "frozen_workers"
path = "src/bin/frozen_workers.rs"
required-features = ["shm"]

# `docs/PHASE5.md` §12 gate criterion 2: `.tft` open under 10 ms for a 233 MB index. `shm` because
# `Tree::open_frozen` needs it. Its own binary: `EVIDENCE.md`'s Gates table is one artifact per criterion.
[[bin]]
name = "frozen_open"
path = "src/bin/frozen_open.rs"
required-features = ["shm"]

# `docs/PHASE5.md` §12 gate criterion 5: ingest throughput >= 10x real time. No `required-features`:
# ingest needs no shared memory, so `just test` runs this and `tests/ingest_throughput.rs` per PR.
[[bin]]
name = "ingest_throughput"
path = "src/bin/ingest_throughput.rs"

# Is the C ABI's +101 ns on a shared arena the ABI or the C++ caller? Calls `tft_plan_at` from
# Rust on the arena a C++ probe measures at 302 ns. Needs `bridge`.
[[bin]]
name = "abi_attached"
path = "src/bin/abi_attached.rs"
required-features = ["abi-probe"]

# PHASE2 §12's attach rows (`report.rs`'s `attach_latency`). Needs `shm`.
[[bin]]
name = "attach_bench"
path = "src/bin/attach_bench.rs"
required-features = ["shm"]

# Reader child for the multi-process test and benchmark; attaches over an inherited fd.
[[bin]]
name = "shm_child"
path = "src/bin/shm_child.rs"
required-features = ["shm"]

# Needs a real `memfd`, so only builds with `shm`.
[[example]]
name = "heap_vs_shared"
required-features = ["shm"]

# Same reason: the `MAP_SHARED` memfd mapping is what `transparent_hugepage/shmem_enabled` governs.
[[example]]
name = "hugepage_grant"
required-features = ["shm"]

# The workspace's only `fork()`; its `unsafe` is a recorded exception (`docs/decisions/0005` step 9).
[[bin]]
name = "fork_child"
path = "src/bin/fork_child.rs"
required-features = ["shm"]

# Multi-process benchmark driver: N reader processes on one shared arena.
[[bin]]
name = "mp_consumer"
path = "src/bin/mp_consumer.rs"
required-features = ["shm"]

# Coordinator for the multi-process node evaluation.
[[bin]]
name = "mp_bench"
path = "src/bin/mp_bench.rs"
required-features = ["shm"]

[[bin]]
name = "shm_scaling"
path = "src/bin/shm_scaling.rs"
required-features = ["shm"]

# `docs/PHASE2.md` §11.4's `shm_torture`, run nightly per `docs/PHASE5.md` §10. No
# `required-features`: without `shm` it exits non-zero, and `just shm-torture-self-test` runs it.
[[bin]]
name = "shm_torture"
path = "src/bin/shm_torture.rs"

# The torture harness's own gate; run by `just shm-torture-self-test`, which `just shm-check` calls.
[[test]]
name = "torture"
required-features = ["shm"]

# `frozen_workers`'s exit status; `required-features` as for `torture`. `just shm-check` runs it.
[[test]]
name = "gate4"
required-features = ["shm"]

[[bench]]
name = "py_parity"
harness = false

# PHASE5 §5.7's measurement: a ratio between two loop shapes and a contention curve, not a criterion distribution.
[[bin]]
name = "counter_cost"

# PHASE5 §9's artifact: one command, one `report/` directory; refuses a report that breaks §9.3.
[[bin]]
name = "bench_report"
path = "src/bin/bench_report.rs"

# PHASE5 §9.2's embedding row. `required-features` because the in-crate column is
# `tf_tree_core::bench_probe`, compiled only under `bench-probe`. A `bin`, not a criterion bench:
# two columns are timed back to back in one round across two `[profile.*]` builds (`src/embed.rs`).
[[bin]]
name = "embed_cost"
path = "src/bin/embed_cost.rs"
required-features = ["embed-probe"]

# The A/B differ. No `required-features`: it compares two JSON files and must build in a plain `--workspace`.
[[bin]]
name = "bench_ab"
path = "src/bin/bench_ab.rs"

# Reader/writer child for `contended_scaling`, placed on a core by `taskset`.
[[bin]]
name = "load_child"
path = "src/bin/load_child.rs"
required-features = ["shm"]

# `docs/PHASE1.md` §11.2's read-scaling row, with the writers and pinning it specifies.
[[bin]]
name = "contended_scaling"
path = "src/bin/contended_scaling.rs"
required-features = ["shm"]

# The extreme-scale sweep; single-process, so no `required-features`.
[[bin]]
name = "scale_sweep"
path = "src/bin/scale_sweep.rs"

# The long-duration soak: watches a healthy system for drift, a different question from `shm_torture`'s.
[[bin]]
name = "soak"
path = "src/bin/soak.rs"

# The Rust half of the §9.1 end-to-end comparison: generates the inputs and aggregates the outputs.
# No `required-features`.
[[bin]]
name = "dds_report"
path = "src/bin/dds_report.rs"

# Which consumer build does the gated headline ratio speak for? Same paired harness as `ratio.rs`,
# built under `[profile.embedder]` by `just tf2-ratio-profiles`.
[[bin]]
name = "tf2_ratio"
path = "src/bin/tf2_ratio.rs"
required-features = ["tf2"]

# `docs/PHASE2.md` §12.2's two ownership-migration rows and §12.3 gate 4b. Needs `shm`.
[[bin]]
name = "owner_migration"
path = "src/bin/owner_migration.rs"
required-features = ["shm"]

# `docs/decisions/0023` step 5's instrument: `tf_tree_c`'s ABI gate cannot call
# `mp::require_quiet_machine` without a dependency cycle, so `just abi-cost` brackets the run with this.
[[bin]]
name = "quiet_check"
path = "src/bin/quiet_check.rs"
