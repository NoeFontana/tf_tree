[package]
name = "tf_tree_bench"
description = "Criterion benchmarks for tf_tree, including the tf2 comparison harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Harness, not a library: fixtures, the tf2 differential, and the `docs/PHASE5.md`
# §9 report. §9.3 requires the harness to live in this repository ("no private
# benchmark"), which it does — but nobody `cargo add`s a benchmark harness, and
# publishing one would drag `libc` and the ROS-adjacent optional dependency onto
# crates.io for no consumer.
publish = false

[lints]
workspace = true

[features]
default = ["counters"]
# Passthrough, so `counter_cost` can measure both sides of §5.5's switch from
# one crate. Without it, `cfg!(feature = "counters")` here reads *this* crate's
# features and reports OFF while the engine is counting.
counters = ["tf_tree/counters"]
# The `tf2::BufferCore` differential path. Requires a ROS 2 install and the C++
# FFI shim described in `src/tf2.rs`; deliberately *not* built on the host used
# for this PR (there is no ROS 2 here). Enabling it without the shim is expected
# to fail to link — that is the honest signal the ROS toolchain is absent.
tf2 = ["dep:tf_tree_tf2_sys"]
# Phase 2 shared memory: the multi-process integration test and benchmark.
# Linux-only; needs `tf_tree`'s `shm` feature for `build_shared`/`attach_shared`.
shm = ["tf_tree/shm"]
# `docs/PHASE5.md` §9.2's embedding row needs an **in-crate** column, and the
# crate in question is `tf_tree_core`. Default-off for the same reason
# `tf_tree_core/bench-probe` is: nothing that ships enables it. `just
# embed-cost-check` is what compiles, lints and tests this configuration —
# `cargo nextest run --workspace` builds default features and therefore does
# not, exactly like `shm`.
embed-probe = ["tf_tree_core/bench-probe"]

[dependencies]
# `features = ["unstable"]` — `docs/API.md` §2.6. The harnesses measure the
# arena itself (`footprint`, `soak`, `shm_torture`, `contended_scaling`) and
# reach it through `Tree::arena_view`. A benchmark crate is exactly the consumer
# the unstable tier is for: `publish = false`, rebuilt with the engine.
tf_tree = { workspace = true, features = ["unstable"] }
tf_tree_core.workspace = true
tf_tree_math.workspace = true
anyhow.workspace = true
# `fork()` and `waitpid()` for `src/bin/fork_child.rs`; there is no other way to
# produce a child that inherits an address space and its open file descriptions.
libc.workspace = true
# `fork_child` probes the claim lease from an *independent* open file
# description, which is the only vantage point an OFD lock is visible from.
tf_tree_ipc.workspace = true
# Optional, and outside the workspace on purpose (see the root manifest): this
# is the only edge that reaches ROS 2, and it is pulled in solely by `--features tf2`.
tf_tree_tf2_sys = { path = "../tf_tree_tf2_sys", optional = true }

# **Reading** the committed baseline (`src/baseline.rs`), and nothing else —
# `results.json` is still *written* by hand, for the schema-stability reason
# `src/report.rs` gives. A hand-rolled parser for somebody else's committed file
# would fail open, which is the one failure mode a regression gate cannot have.
#
# It costs the workspace nothing: `criterion`, already a dev-dependency here,
# pulls the identical `serde_json` version into the lockfile, and this crate is
# `publish = false`. It is a normal dependency rather than a dev one because
# `[[bin]]` targets do not see dev-dependencies and the gate lives in
# `bench_report`.
serde_json.workspace = true

# `report::worse_entries` states the arena memory floor as arithmetic on the
# layout rather than a measurement, so the layout math has to be reachable from
# the library, not only from the relocation gate's dev-dependency.
tf_tree_arena.workspace = true

[dev-dependencies]
criterion.workspace = true

# Criterion benches (harness = false, driven by `criterion_group!`/`main!`). These
# compile and run on any machine, but they are *not* the official go/no-go gate,
# which needs dedicated, core-pinned hardware (see `docs/PHASE1.md` §11.3).
[[bench]]
name = "lookup"
harness = false

[[bench]]
name = "query_mix"
harness = false

[[bench]]
name = "at_many"
harness = false

[[bench]]
name = "push"
harness = false

[[bench]]
name = "read_scaling"
harness = false

# The head-to-head against ROS 2 tf2. `required-features` keeps it out of a
# normal `cargo bench`, so the suite still builds on hosts without ROS.
[[bench]]
name = "tf2_compare"
harness = false
required-features = ["tf2"]

# Concurrent read-scaling harness. A binary rather than a criterion bench because
# `docs/PHASE1.md` §11.2 wants p99.9 per *lookup*, and criterion reports the distribution
# of batch times, which hides exactly the outliers a lock introduces.
[[bin]]
name = "tf2_scaling"
path = "src/bin/tf2_scaling.rs"
required-features = ["tf2"]

# Memory footprint and instructions-per-lookup. No `required-features`: the
# tf_tree-side modes must run on a host without ROS, so the tf2 modes are gated
# inside the binary instead of excluding the whole target.
[[bin]]
name = "footprint"
path = "src/bin/footprint.rs"

# Reader child for the multi-process test and benchmark. It attaches to a shared
# arena over an inherited fd, so it must be a separate executable.
[[bin]]
name = "shm_child"
path = "src/bin/shm_child.rs"
required-features = ["shm"]

# Needs a real `memfd`, so it only builds with `shm` — otherwise
# `--workspace --all-targets` tries to compile it and fails.
[[example]]
name = "heap_vs_shared"
required-features = ["shm"]

# Same reason: the whole point is the `MAP_SHARED` memfd mapping, whose
# huge-page policy is the one `transparent_hugepage/shmem_enabled` governs.
[[example]]
name = "hugepage_grant"
required-features = ["shm"]

# The workspace's only `fork()`. See the file header for why `unsafe` here is a
# recorded exception (`docs/decisions/0005` step 9) rather than an oversight.
[[bin]]
name = "fork_child"
path = "src/bin/fork_child.rs"
required-features = ["shm"]

# Multi-process benchmark driver: N reader processes on one shared arena.
[[bin]]
name = "mp_consumer"
path = "src/bin/mp_consumer.rs"
required-features = ["shm"]

# Coordinator for the multi-process node evaluation.
[[bin]]
name = "mp_bench"
path = "src/bin/mp_bench.rs"
required-features = ["shm"]

[[bin]]
name = "shm_scaling"
path = "src/bin/shm_scaling.rs"
required-features = ["shm"]

# **`docs/PHASE2.md` §11.4's `shm_torture`**, which `docs/PHASE5.md` §10 wants
# running nightly. Deliberately **no** `required-features`: the binary compiles
# everywhere and, without `shm`, exits non-zero saying there is no shared arena
# to torture. `just shm-torture-self-test` runs it in `cargo nextest run
# --workspace`'s build, and a target that vanished from the default build would
# take that gate with it.
[[bin]]
name = "shm_torture"
path = "src/bin/shm_torture.rs"

# The torture harness's own gate. `required-features` keeps it out of
# `cargo nextest run --workspace` (which builds without `shm`, where the binary
# has nothing to torture); `just shm-torture-self-test` is where it runs, and
# `just shm-check` calls that.
[[test]]
name = "torture"
required-features = ["shm"]

[[bench]]
name = "py_parity"
harness = false

# **PHASE5 §5.7's required measurement.** Not a criterion bench: the question is
# a ratio between two loop shapes and a contention curve, not a distribution,
# and criterion's per-iteration setup would sit inside the thing being measured.
[[bin]]
name = "counter_cost"

# **PHASE5 §9's artifact.** One command, one `report/` directory. It orchestrates
# measurements that live elsewhere rather than reimplementing them, and refuses
# to write a report that breaks §9.3 (see `src/report.rs`).
[[bin]]
name = "bench_report"
path = "src/bin/bench_report.rs"

# **PHASE5 §9.2's embedding row.** `required-features`, because the row's
# in-crate column is `tf_tree_core::bench_probe` and that module is compiled
# only under `tf_tree_core/bench-probe`. The out-of-crate column is ordinary code
# here — the *point* is that the two bodies are identical and only their crate
# differs — so the binary is useless without the feature and says so at build
# time rather than by silently measuring one column twice.
#
# It is a `bin` rather than a criterion bench because the row is a *program*:
# two columns timed back to back inside one round so the per-round quotients
# pair, a JSON handshake between two processes built under two `[profile.*]`
# sections, and provenance checks on the pair. Criterion estimates one routine
# at a time and owns the process and the output. Not the profile — `cargo bench`
# accepts `--profile`; `crates/tf_tree_bench/src/embed.rs` states the reasons
# `benches/lookup.rs` cannot be extended into this row.
[[bin]]
name = "embed_cost"
path = "src/bin/embed_cost.rs"
required-features = ["embed-probe"]

# **The A/B differ.** Deliberately no `required-features`: it reads two JSON
# files and compares them, so it must build — and be testable — in the same
# plain `--workspace` build the harnesses that need `shm` cannot appear in.
# A comparison tool that only exists in the configuration that produces the
# heaviest measurements is one nobody reaches for on the light ones.
[[bin]]
name = "bench_ab"
path = "src/bin/bench_ab.rs"

# Reader/writer child for `contended_scaling`. It attaches to a shared arena over
# an inherited fd and is placed on a core by `taskset`, so it must be a separate
# executable — the same reason `shm_child` and `mp_consumer` are.
[[bin]]
name = "load_child"
path = "src/bin/load_child.rs"
required-features = ["shm"]

# **`docs/PHASE1.md` §11.2's read-scaling row, with the writers and the pinning
# it actually specifies.** Every other reader benchmark here runs against a
# quiescent tree; this one does not, which is the whole reason it exists.
[[bin]]
name = "contended_scaling"
path = "src/bin/contended_scaling.rs"
required-features = ["shm"]

# **The extreme-scale sweep.** No `required-features`: every axis it measures —
# width, ring depth, publish fan-out, and the arena's own limits — is a
# single-process property, so it must run on a host with neither ROS nor shared
# memory. That is the same reasoning `footprint` uses.
[[bin]]
name = "scale_sweep"
path = "src/bin/scale_sweep.rs"

# **The long-duration soak.** Single process, so no `shm` and no ROS; it watches
# a healthy system for drift over minutes to hours, which is a different question
# from `shm_torture`'s (correctness under `SIGKILL`) and is not answerable by
# running that one for longer.
[[bin]]
name = "soak"
path = "src/bin/soak.rs"

# **The Rust half of the §9.1 end-to-end comparison.** It generates the inputs
# (so the publisher, the bridge config and the query set all come from one
# workload entry rather than three hand-written files) and aggregates the
# outputs. No `required-features`: `emit-config` must run wherever the container
# is driven from, and the aggregation is text processing.
[[bin]]
name = "dds_report"
path = "src/bin/dds_report.rs"
