[package]
name = "tf_tree_cli"
description = "The tf_tree diagnostics CLI (binary `tf_tree`, alias `tft`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Not published: three `[dependencies]` (`tf_tree_bench`, `tf_tree_bridge`, `tf_tree_ingest`) are `publish = false`, so are path-only.
# `docs/PHASE5.md` §10 owns the distribution question.
publish = false

[lints]
workspace = true

# `doc = false`: the `tf_tree` bin name collides with the library crate's rustdoc output.
[[bin]]
name = "tf_tree"
path = "src/main.rs"
doc = false

[[bin]]
name = "tft"
path = "src/bin/tft.rs"
doc = false

[dependencies]
# `unstable` unconditionally (`docs/API.md` §2.6): `tree`, `doctor` and `top` need `Tree::arena_view` and `EdgeKind`.
tf_tree = { workspace = true, features = ["unstable"] }
tf_tree_core.workspace = true
tf_tree_math.workspace = true
# Three imports from `tf_tree_bench`: `fixture` (the tree when no `--attach`/`--from-bag`/`--from-file` is named, and `PushSample`, shared with the
# benchmarks so a finding and a bench row run on the same tree), `replay::TfStream`, and `differential::run_naive_rust`.
tf_tree_bench.workspace = true
# `docs/PHASE4.md` §5.8's `--discover`: the collector and config format live in the bridge.
tf_tree_bridge.workspace = true
anyhow.workspace = true
clap.workspace = true
# `docs/PHASE5.md` §3. Not optional: `tf_tree ingest` is the one subcommand a
# user with no `tf_tree` deployment can run, so gating it behind a feature would
# put the adoption wedge behind a rebuild.
tf_tree_ingest.workspace = true
# `tf_tree participants` reads the lock file **without the arena** (§3.3), which
# is the whole point of that subcommand: it must work when the segment is gone.
tf_tree_ipc = { workspace = true, optional = true }

[features]
default = ["counters", "compression"]
# zstd/lz4 support: the workspace declares `tf_tree_ingest` with `default-features = false`, and workspace builds hide the missing edge by feature
# unification; `cargo build -p tf_tree_cli` and `cargo install` do not. Codecs are pure Rust.
compression = ["tf_tree_ingest/compression"]
# `docs/PHASE5.md` §5's counters, read by `TFT010`/`TFT011`; the workspace declares `tf_tree` with `default-features = false`.
counters = ["tf_tree/counters"]
# Attach to a live arena (`--attach`) and `tf_tree participants`. Linux-only,
# and off by default so the single-process CLI does not grow a syscall
# dependency it never uses.
shm = ["tf_tree/shm", "dep:tf_tree_ipc", "tf_tree_ingest/shm"]

[dev-dependencies]
# Reads `doctor --json` back in `tests/catalogue.rs` only (`docs/PHASE5.md` §11 schema validation). Already in the build graph via `tf_tree_bench`.
serde_json.workspace = true
# `sizing.rs`'s four constants are checked against two real layouts; dev-only so no layout type reaches the binary.
tf_tree_arena.workspace = true
# `fixture` writes the synthetic recordings `tests/ingest.rs` uses; off in the normal build.
tf_tree_ingest = { workspace = true, features = ["fixture"] }
