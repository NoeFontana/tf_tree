[package]
name = "tf_tree_cli"
description = "The tf_tree diagnostics CLI (binary `tf_tree`, alias `tft`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# **Not published, and the reason is mechanical rather than a status claim.**
# Three of this crate's `[dependencies]` are themselves `publish = false` —
# `tf_tree_bench`, `tf_tree_bridge` and `tf_tree_ingest`, each for a reason
# stated in its own manifest — so they are path-only, with no version to publish
# against. Flip this line to `true` and `cargo publish --dry-run -p tf_tree_cli`
# answers "all dependencies must have a version requirement specified when
# publishing / dependency `tf_tree_bench` does not specify a version". That is a
# fact cargo checks, not a policy this file has to keep current.
#
# It is deliberately not a sentence about which section has landed. A reason of
# that shape rots the moment `docs/PHASE5.md` §0.0 moves, because §0.0 moves and
# a string in this file does not — and a stale reason in a manifest is exactly
# the defect class §9.3 spends a page on. The dependency edge above cannot go
# stale silently. Publishing becomes possible when those three crates do;
# `docs/PHASE5.md` §10 owns the distribution question, not this comment.
publish = false

[lints]
workspace = true

# `doc = false`: the binaries carry no public API to document, and the `tf_tree`
# bin name otherwise collides with the `tf_tree` library crate's rustdoc output.
[[bin]]
name = "tf_tree"
path = "src/main.rs"
doc = false

[[bin]]
name = "tft"
path = "src/bin/tft.rs"
doc = false

[dependencies]
tf_tree.workspace = true
tf_tree_core.workspace = true
tf_tree_math.workspace = true
# The CLI operates on an in-process tree; Phase 1 has no cross-process attach
# (that is Phase 2 shared memory), so it drives the shared benchmark fixture.
tf_tree_bench.workspace = true
# **`docs/PHASE4.md` §5.8's `--discover`.** The collector and the config format
# live in the bridge because the `rclcpp` half needs them too; the CLI is the
# host-side front end that feeds them a `.tfstream` instead of a subscription.
tf_tree_bridge.workspace = true
anyhow.workspace = true
clap.workspace = true
# `docs/PHASE5.md` §3. Not optional: `tf_tree ingest` is the one subcommand a
# user with no `tf_tree` deployment can run, so gating it behind a feature would
# put the adoption wedge behind a rebuild.
tf_tree_ingest.workspace = true
# `tf_tree participants` reads the lock file **without the arena** (§3.3), which
# is the whole point of that subcommand: it must work when the segment is gone.
tf_tree_ipc = { workspace = true, optional = true }

[features]
default = ["counters"]
# `docs/PHASE5.md` §5's diagnostic counters, which `TFT010`/`TFT011` read.
# Needed explicitly because the workspace declares `tf_tree` with
# `default-features = false` (see the comment on that declaration): without
# this line the CLI would link an engine that counts nothing and `doctor` would
# report "no extrapolation failures" on an arena that has never counted one.
counters = ["tf_tree/counters"]
# Attach to a live arena (`--attach`) and `tf_tree participants`. Linux-only,
# and off by default so the single-process CLI does not grow a syscall
# dependency it never uses.
shm = ["tf_tree/shm", "dep:tf_tree_ipc", "tf_tree_ingest/shm"]

[dev-dependencies]
# The `fixture` feature writes the synthetic recordings `tests/ingest.rs` runs
# the binary against. Off in the normal build (it fabricates recordings), on
# here, which is the only place a fabricated recording belongs.
tf_tree_ingest = { workspace = true, features = ["fixture"] }
