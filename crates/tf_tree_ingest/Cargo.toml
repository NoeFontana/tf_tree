[package]
name = "tf_tree_ingest"
description = "Bag ingestion for tf_tree: MCAP recordings to a live arena or a frozen .tft (docs/PHASE5.md §3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# Not published while `docs/PHASE5.md` §3.3 is partial (this crate reads MCAP only).
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Chunk decompression; the codecs are pure Rust and the feature is not named
# `zstd`/`lz4` (`docs/PHASE2.md` §2).
compression = ["dep:ruzstd", "dep:lz4_flex"]
default = ["compression"]
# `.tft` writing needs `tf_tree`'s Linux-only frozen backend.
shm = ["tf_tree/shm"]
fixture = []

[dependencies]
tf_tree.workspace = true
tf_tree_bridge.workspace = true
# `default-features = false` is load-bearing (`docs/PHASE5.md` §0.0, `docs/PHASE2.md` §2):
# `mcap`'s defaults vendor C.
mcap = { version = "0.25", default-features = false }
# Pure-Rust zstd decoder (`docs/PHASE2.md` §2). Its `unsafe` is a dependency
# fact outside `docs/decisions/0007`'s budget. `default-features = false` drops
# `hash`, which `crate::decompress` never calls.
ruzstd = { version = "0.9", optional = true, default-features = false, features = [
    "std",
] }
# Pure-Rust lz4 decoder: MCAP's `"lz4"` is the frame format. Default features
# stay ON: `safe-encode`/`safe-decode` keep the unsafe block code uncompiled.
lz4_flex = { version = "0.14", optional = true }
thiserror.workspace = true
# Chunk CRC32 validation (`mcap` verifies only under `validate_chunk_crcs`).
crc32fast = { version = "1", default-features = false }
# `docs/PHASE5.md` §2.3's `source_digest` (`docs/decisions/0046`).
blake3 = { workspace = true }

[dev-dependencies]
# Enables `fixture` for this crate's tests; `default-features = false` because
# dev-dependency features unify with the package's.
tf_tree_ingest = { path = ".", default-features = false, features = ["fixture"] }
blake3 = { workspace = true }

[[test]]
name = "frozen_bag"
required-features = ["shm"]

[[example]]
name = "gen_zstd_conformance"
required-features = ["fixture"]
