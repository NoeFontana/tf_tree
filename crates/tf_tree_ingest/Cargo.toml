[package]
name = "tf_tree_ingest"
description = "Bag ingestion for tf_tree: MCAP recordings to a live arena or a frozen .tft (docs/PHASE5.md §3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# **Not published while §3 is partial.** `docs/PHASE5.md` §3.3 names four
# sources; this crate reads one of them (MCAP). A crate called
# `tf_tree_ingest` on crates.io would advertise rosbag2-sqlite3 and
# `freeze_from_arrays` that are not here. Publish when §3.3 is complete.
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# **Chunk decompression, and it is ON by default because a default-off fix is a
# fix nobody gets.** rosbag2 and Foxglove both write zstd chunks by default, so
# without this the ordinary case — a user pointing `tf_tree ingest` at a real
# bag — fails with `IngestError::CompressedChunk`.
#
# **One feature, not `zstd` + `lz4`.** A bag is whatever the recorder wrote, so
# nobody wants zstd-but-not-lz4; splitting it yields four configurations of
# which three would never be exercised by any gate.
#
# **And it is deliberately not *named* `zstd`/`lz4`**, because those read as
# "turn on `mcap`'s zstd/lz4 features" — which is exactly the mistake that
# reintroduces the C build step `docs/PHASE2.md` §2 forbids. The codecs behind
# this flag are ours and pure Rust; see the two dependencies below.
compression = ["dep:ruzstd", "dep:lz4_flex"]
default = ["compression"]
# Writing a `.tft` (`docs/PHASE5.md` §2) needs `tf_tree`'s frozen backend, which
# is Linux-only and behind `shm` because it reuses the same mapping code. Ingest
# into an in-process `Tree` needs none of that and is always available, which is
# what keeps the two-pass logic under plain `cargo nextest run --workspace`.
shm = ["tf_tree/shm"]
# The synthetic MCAP fixture writer. **Off by default**: it is test scaffolding,
# not a product surface, and it fabricates recordings — a name a user could
# reach for by accident is a name they will eventually mistake for real data.
fixture = []

[dependencies]
tf_tree.workspace = true
tf_tree_bridge.workspace = true
# **`default-features = false` is load-bearing and is `docs/PHASE5.md` §0.0's
# decisive constraint.** The crate's defaults are `[zstd, lz4]`, which vendor C
# through `zstd-sys`/`lz4-sys` and violate `docs/PHASE2.md` §2's no-C-build-step
# rule. That rule is untouched by the `compression` feature above: the codecs
# this crate decodes chunks with are **ours** — pure-Rust `ruzstd` and
# `lz4_flex`, driven by `crate::decompress` over a chunk handed over whole — so
# no `*-sys` crate enters the graph and there is still no C build step. What
# `mcap` keeps owning is every record *body*; what it must never own is the
# decompressor factory, which is the only thing its `zstd`/`lz4` features are
# for.
mcap = { version = "0.25", default-features = false }
# **The zstd decoder, pure Rust — `docs/PHASE2.md` §2's no-C rule is why it is
# this crate and not `zstd`/`zstd-sys`.** rosbag2 and Foxglove write zstd chunks
# by default, so this is the codec that decides whether an ordinary bag ingests.
#
# Supply-chain disclosure, because "pure Rust" is not "safe Rust": ruzstd
# carries **39 `unsafe` occurrences across two files**
# (`decoding/ringbuffer.rs`, `decoding/decode_buffer.rs`), compiled
# unconditionally under every feature combination. That is a fact about a
# dependency, not a hole in ours — `docs/decisions/0007`'s unsafe budget and
# this crate's `#![forbid(unsafe_code)]` are about boundaries *we* own — but a
# reader weighing the decoder against the C one deserves the number rather than
# an implication that there is none.
#
# It also fixes the workspace MSRV at 1.87 (`rust-version = "1.87"`); the root
# manifest's MSRV comment records that trade.
#
# **`default-features = false` here, and it means the opposite of what it means for
# `lz4_flex` below — the asymmetry is the point.** ruzstd's defaults are
# `["hash", "std"]`, and `hash` gates a *computation*, not a `forbid(unsafe_code)`
# attribute. With it on, `DecodeBuffer::drain_to`/`drain` xxhash64 every byte they
# hand out — unconditionally, not only when the frame declares a content checksum —
# and the sole consumer of the result is `get_calculated_checksum()`, which
# `crate::decompress` deliberately never calls, because the chunk's own CRC32 over
# the same bytes is the hash the MCAP writer actually committed to. So the hottest
# loop in the ingest was making a full extra pass over every decompressed byte to
# produce a number nothing reads. Measured once on a 4 MiB libzstd `-3` frame the
# saving was about **1%**, which is inside this host's run-to-run spread — so the
# case for turning it off is that the work is provably unused, not that the
# benchmark is decisive.
#
# **CORRECTION (2026-09-05): the two decode-rate figures that stood here are
# deleted.** This comment read "673.9 against 665.1 MiB/s". Nothing in this
# repository re-derives either, and `docs/benchmarks/EVIDENCE.md`'s rule is that
# a probe's figure needs a documented command; the percentage is what the
# argument uses and it is kept. `crates/tf_tree_ingest/src/decompress.rs` and
# `src/fixture.rs` carry the same correction for the same reason. `just gate5`
# measures a whole ingest and does not produce a per-frame decode rate.
#
# Decoding is unaffected: `state.check_sum` is read from the stream outside the
# `cfg` and `decode_all` compares nothing either way, so a frame carrying an XXH64
# content checksum still decodes byte-identically.
#
# Two consequences worth stating rather than leaving to be discovered.
# `twox-hash` stays in `Cargo.lock` regardless, pulled by `lz4_flex`'s `frame`
# feature, so neither the lock file's crate list nor the licence position changes.
# And `encoding::FrameCompressor` sets `content_checksum: cfg!(feature = "hash")`,
# so the round-trip fixtures now carry frames without a zstd content checksum —
# which matches `testdata/ATTRIBUTION.md`'s deliberate `--no-check` on the
# conformance fixture, and matches the fact that nothing here would verify one.
ruzstd = { version = "0.9", optional = true, default-features = false, features = [
    "std",
] }
# **The lz4 decoder, pure Rust. MCAP's `"lz4"` is the LZ4 *frame* format**, so
# `crate::decompress` drives `lz4_flex::frame::FrameDecoder` and never the
# block-format helpers — the crate `#[deprecated]`s its crate-root block
# re-exports precisely because reaching for them here is a silent correctness
# bug rather than a compile error.
#
# **Its default features are kept on purpose, and that inverts the reflex this
# manifest applies everywhere else.** lz4_flex has no crate-level
# `forbid(unsafe_code)`; the attribute is applied per module, gated on
# `all(feature = "safe-encode", feature = "safe-decode")`, both of which are
# defaults. Under them `frame/decompress.rs` contains **zero** `unsafe` and the
# 35 unsafe sites in `block/decompress.rs` plus 9 in `fastcpy_unsafe.rs` are
# never compiled. Writing `default-features = false` here would silently opt us
# *into* them, which is the opposite of what it does for every other dependency
# in this file. `frame` is a default feature and implies `std`.
lz4_flex = { version = "0.14", optional = true }
# Not named here, but new in `Cargo.lock` and worth one line: **`twox-hash 2.x`
# arrives through `lz4_flex`**, whose `frame` feature wants xxhash32 for the LZ4
# frame checksum. It used to arrive through ruzstd's `hash` feature as well; that
# is off now (see above) and `twox-hash` stays anyway, which is why turning it off
# changed the lock file by one dependency edge and not by one crate. It carries 4
# `unsafe` occurrences. `cargo tree -i twox-hash` is the check.
thiserror.workspace = true
# **Chunk CRC32 validation, which became this crate's job with `emit_chunks`.**
#
# `mcap`'s own check runs only under `validate_chunk_crcs`, which its
# `LinearReaderOptions::default()` leaves off — so chunk CRCs were never verified
# here at all. Doing it ourselves is a net gain, not a new cost.
#
# Already in `Cargo.lock` via `mcap` itself, so this adds no transitive
# dependency and no build step; it is the same crate, named directly.
crc32fast = { version = "1", default-features = false }
# `docs/PHASE5.md` §2.3's `source_digest`, which is specified as BLAKE3 of the
# source recording. Already in the lock file via `tf_tree_core`, so it costs
# nothing new; `default-features = false` keeps it consistent with that use.
#
# **Not optional, and it was until `docs/decisions/0046`.** It used to be pulled
# in by `shm`, because the only caller was `tft::freeze_bag` and the frozen
# backend is Linux-only. `digest_file` is now at the crate root and unconditional
# so that `tf_tree_py`'s `ingest_bag` can report a recording's digest on every
# platform the wheel builds for, including those with no frozen backend. This
# adds nothing to any build: `cargo tree -p tf_tree_ingest --no-default-features`
# already lists blake3, because `tf_tree_core` requires it (D14).
blake3 = { workspace = true }

[dev-dependencies]
# Self-reference so the fixture writer is compiled for this crate's own tests
# without being part of what the crate ships. Cargo unifies the two views of the
# package, so the lib is built once, with `fixture` on, for the test profile.
#
# **`default-features = false` here is what makes `--no-default-features`
# testable at all**, and it is easy to get wrong: a dev-dependency's features are
# unified with the package's own, so without this line
# `cargo nextest run -p tf_tree_ingest --no-default-features` would re-enable
# `compression` through this very edge and the codec-free build — the one
# `#[cfg(not(feature = "compression"))]` tests exist for — would be compiled by
# nothing. The package's own defaults still apply when it is the package being
# built, so the ordinary `cargo nextest run -p tf_tree_ingest` is unaffected.
tf_tree_ingest = { path = ".", default-features = false, features = ["fixture"] }
# `tests/frozen_bag.rs` recomputes §2.3's `source_digest` independently of the
# code that wrote it, so the assertion is not the implementation compared with
# itself.
blake3 = { workspace = true }

# The `.tft` half needs the frozen backend, which is Linux-only and behind
# `shm`. Declared so `cargo nextest run --workspace` (no features) does not try
# to build it and `just shm-check` does.
[[test]]
name = "frozen_bag"
required-features = ["shm"]

# The generator behind `testdata/zstd_conformance.mcap`. An example rather than a
# test because it **shells out to the host's `zstd` CLI**, which is a build-host
# assumption no gate may depend on; the committed output is what the gate reads.
# `testdata/ATTRIBUTION.md` records the provenance and the command line.
[[example]]
name = "gen_zstd_conformance"
required-features = ["fixture"]
