[package]
name = "tf_tree_core"
description = "no_std+alloc single-process transform tree engine: interning, topology, arena buffers, plans."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# `cfg(loom)` is registered in the root `[workspace.lints.rust]` (unexpected_cfgs),
# so this crate can inherit the full lint set normally.
[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# **Default-on** (`docs/PHASE5.md` §5.5). Disabling it removes the counter
# fields, the increments and the `Guard` destructor — what executes is then
# provably nothing, which is what a safety-certified or minimal-embedded build
# needs. The arena *regions* remain either way (D34), so the layout hash does
# not fork and the two builds still attach to each other.
default = ["counters"]
counters = []
# Route libm through its soft-float paths. Needed **only** under Miri, whose
# interpreter cannot execute the x86 inline `sqrt` asm libm's default `arch`
# feature emits. `just miri` turns it on explicitly.
#
# This is deliberately NOT a dev-dependency feature: cargo's feature resolution
# unifies dev-dependency features with the normal dependency whenever dev-deps
# are built, so `cargo build --workspace --all-targets`, `cargo nextest run` and
# any workspace-wide `cargo bench` would all have compiled libm — and therefore
# every `sqrt`/`sin`/`cos` in the shipped binaries and the benchmarks — with
# soft floats, silently invalidating the perf gate.
miri-soft-float = ["libm/force-soft-floats", "tf_tree_math/miri-soft-float"]
# **Default-off benchmark hook**, and the only thing it adds is `bench_probe`:
# two `#[inline(never)]` wrappers around `Plan::at`, compiled *in this crate* so
# `docs/PHASE5.md` §9.2's embedding row has an in-crate column to gate the
# separate-crate one against. No shipped crate enables it — `tf_tree`,
# `tf_tree_c`, `tf_tree_py` and `tf_tree_cli` do not mention it — and it is the
# same shape as `tf_tree_c`'s `test-hooks`, which exists so `abi_cost.rs` can
# measure the `catch_unwind` boundary. `just embed-cost-check` is its gate.
bench-probe = []

[dependencies]
tf_tree_math.workspace = true
tf_tree_arena.workspace = true
libm.workspace = true
bytemuck.workspace = true
# no_std; resolves the BLAKE3 name-hash mandate of `docs/PHASE1.md` §5.1 against
# the dependency budget in `docs/PHASE1.md` §0.
blake3 = { workspace = true }

[dev-dependencies]
proptest.workspace = true

[target.'cfg(loom)'.dev-dependencies]
loom.workspace = true
