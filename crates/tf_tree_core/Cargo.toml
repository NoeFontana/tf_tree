[package]
name = "tf_tree_core"
description = "no_std+alloc single-process transform tree engine: interning, topology, arena buffers, plans."
# Per-crate front page for crates.io (not inherited; see `tf_tree_math`).
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# `cfg(loom)` is registered in the root `[workspace.lints.rust]`.
[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default-on (`docs/PHASE5.md` §5.5). Off removes the counter fields, increments
# and `Guard` destructor; the arena regions remain (D34), so layout hash and
# attachability are unchanged.
default = ["counters"]
counters = []
# Pure-Rust BLAKE3 backend. `blake3` has an unconditional `cc` build-dependency;
# `pure` stops `build.rs` invoking a C compiler. Linux falls back on its own, but
# `*-apple-darwin` and `*-windows-msvc` cross-checks fail without it (issue #180,
# `ci.yml`'s `bindings-non-linux`). It cannot change a hash or a `.tft`.
pure-hash = ["blake3/pure"]
# libm soft-float paths, only for Miri (which cannot run libm's x86 `sqrt` asm);
# `just miri` enables it. Not a dev-dependency feature: unification would build
# every workspace binary and benchmark with soft floats.
miri-soft-float = ["libm/force-soft-floats", "tf_tree_math/miri-soft-float"]
# Default-off: adds `bench_probe`, one `#[inline(never)]` wrapper around
# `Plan::at`, the in-crate column for `docs/PHASE5.md` §9.2's embedding row (twin:
# `tf_tree_bench::embed::one`). No shipped crate enables it; gate is
# `just embed-cost-check`.
bench-probe = []
# Fault injection, `docs/PHASE2.md` §11.3, default-off. Places `crash::SITES`
# abort sites, armed by `TF_TREE_CRASH_AT=<name>:<nth_hit>`; off, `crash_point!`
# expands to nothing. Takes `std` for itself via `extern crate std` in `lib.rs`,
# not a `std` feature, which would unify across the graph and undo `no_std`.
crash-points = []

[dependencies]
tf_tree_math.workspace = true
tf_tree_arena.workspace = true
libm.workspace = true
bytemuck.workspace = true
# no_std; resolves the BLAKE3 name-hash mandate of `docs/PHASE1.md` §5.1 against
# the dependency budget in `docs/PHASE1.md` §0.
blake3 = { workspace = true }

[dev-dependencies]
proptest.workspace = true

[target.'cfg(loom)'.dev-dependencies]
loom.workspace = true
