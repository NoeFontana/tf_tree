[package]
name = "tf_tree_core"
description = "no_std+alloc single-process transform tree engine: interning, topology, arena buffers, plans."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# `cfg(loom)` is registered in the root `[workspace.lints.rust]` (unexpected_cfgs),
# so this crate can inherit the full lint set normally.
[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tf_tree_math.workspace = true
tf_tree_arena.workspace = true
libm.workspace = true
bytemuck.workspace = true
# no_std; resolves the 0003 name-hash mandate. See docs/decisions/0003.
blake3 = { workspace = true }

[dev-dependencies]
proptest.workspace = true
# Force libm's soft-float paths in test builds only: its default `arch` feature
# uses x86 inline `sqrt` asm that Miri cannot execute. This is additive and
# affects only this crate's test/bench binaries, never the production build.
libm = { workspace = true, features = ["force-soft-floats"] }

[target.'cfg(loom)'.dev-dependencies]
loom.workspace = true
