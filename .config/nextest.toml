# A hung test must be a failure, not a wedged run: the waits of 0019
# (`Open::await_open`, `Tree::await_frames`) fail by never returning.
# The slowest legitimate test is ~14 s; warn at 60 s, kill at 180 s. A test that
# needs longer gets its own override here, not a longer global period.
# Retries are off on purpose: a retry that turns a real race green defeats
# `docs/PHASE2.md` §11's crash matrix.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }
final-status-level = "slow"

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
