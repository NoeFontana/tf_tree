[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# **One ignore, and it is narrow on purpose.** An empty list is the right default
# and this is the only entry that has ever been needed; anything added here has
# to carry the same three facts: what the advisory says, why it cannot be fixed,
# and what would make it removable.
ignore = [
    # RUSTSEC-2024-0436 — `paste` is unmaintained. **Not a vulnerability**: the
    # advisory records that the author archived the repository, and says outright
    # "No safe upgrade is available".
    #
    # It arrives through `mcap` (`docs/PHASE5.md` §3.3's primary bag source) and
    # nowhere else. `paste` is a `proc-macro` crate: it runs in the compiler,
    # produces no code of its own in the binary, and is not reachable at runtime,
    # so an unmaintained *macro* expander is a supply-chain concern rather than an
    # exploitable one — and the supply-chain half is already covered by
    # `[sources]` and the committed `Cargo.lock`.
    #
    # Removable the moment `mcap` moves to `pastey` or drops the dependency;
    # nothing on our side can accelerate that, and vendoring an MCAP reader to
    # avoid a proc-macro would be a far larger risk than the one it avoids.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# **`docs/PHASE2.md` §2's no-C-build-step rule, converted from prose into something
# `just lint` can fail on.**
#
# The rule is argued in five places — the root `Cargo.toml`, `tf_tree_ingest`'s
# `mcap`/`ruzstd`/`lz4_flex` dependency comments, `decompress.rs`'s module header and
# `docs/PHASE5.md` §0.0 — and every one of them was a comment. The mistake they warn
# about is concrete and one line long: writing
# `mcap = { features = ["zstd"] }`, or reaching for `zstd = "0.13"` as a
# dev-dependency to generate a fixture. Either pulls a `*-sys` crate whose build
# script compiles C, and before this list `cargo build`, `just test`, `just lint` and
# `cargo deny check` all passed while it happened.
#
# `[graph] all-features = true` above means this sees every feature combination of
# every workspace member, so it cannot be evaded by hiding the dependency behind a
# feature. It is a **ban and not an exception**: it makes the check stricter, and it
# does not false-positive on the current graph — `cargo deny check` passes with it,
# because the pure-Rust `ruzstd`/`lz4_flex` path deliberately reaches none of these.
#
# If a future zstd frame genuinely cannot be decoded by `ruzstd`, the answer is a
# decision record about `docs/PHASE2.md` §2, not an entry removed from here.
deny = [
    { name = "zstd-sys" },
    { name = "lz4-sys" },
    { name = "libz-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
