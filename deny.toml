[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each entry states what the advisory says, why it cannot be fixed, and what
# makes it removable.
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained, not vulnerable, with no safe
    # upgrade. It arrives only through `mcap` (`docs/PHASE5.md` §3.3) and is a
    # proc-macro, absent from the binary at runtime. Removable when `mcap` moves
    # to `pastey` or drops it.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# `docs/PHASE2.md` §2's no-C-build-step rule: no `*-sys` crate that compiles C
# (e.g. `mcap`'s `zstd` feature). `all-features` above means a feature cannot hide
# one. Removing an entry needs a decision record about `docs/PHASE2.md` §2.
deny = [
    { name = "zstd-sys" },
    { name = "lz4-sys" },
    { name = "libz-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
