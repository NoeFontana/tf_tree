version: 2
updates:
  # -------------------------------------------------------------------
  # 1. GitHub Actions Configuration
  # -------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  # -------------------------------------------------------------------
  # 2. Rust / Cargo Configuration
  # -------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    # Group all non-major Cargo updates into a single PR
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # -------------------------------------------------------------------
  # 3. Python / uv Configuration
  # -------------------------------------------------------------------
  # Restored with `pyproject.toml` (`docs/PHASE3.md` §14). The Phase 1 scaffold
  # removed both together, which is why PR #3 sat unmergeable against files
  # that no longer existed.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    # Group all non-major Python updates into a single PR
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
