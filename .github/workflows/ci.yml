# Every job wraps a `just` recipe. A green check covers only what the jobs cover;
# timing recipes are gated by hand. The aarch64 rows are execution, not a proof.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `just lint` runs its dependency recipes (the text checks have no job of their
  # own); `just audit` runs `cargo deny`.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # Full history and tags for `artifact-versions` (`git describe`).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - name: just lint
        run: just lint
      - name: just audit
        run: just audit

  # The MSRV floor (`SUPPORT.md`, `docs/PHASE5.md` §10), read from the manifest and
  # installed for `just msrv`.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: read rust-version from the workspace manifest
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$v" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just msrv
        run: just msrv

  # `tf_tree_py` is outside the workspace. Only a native macOS/Windows check catches
  # an unconditional `shm` import; native because blake3's build script needs a C toolchain.
  bindings-non-linux:
    name: python bindings compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (tf_tree_py)
        run: cargo check --manifest-path crates/tf_tree_py/Cargo.toml --features pyo3/extension-module,pyo3/abi3-py39

  # `just py-compile`; pins 3.13 because `pyo3-build-config` emits `Py_3_x` cfgs
  # for the interpreter it finds.
  bindings:
    name: python bindings compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just py-compile
        run: just py-compile
      # The only thing that compiles `tf_tree_py`'s `pure-hash` feature.
      - name: just py-cross-check
        run: just py-cross-check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: just test
        run: just test

  # `tf_tree` with `unstable` OFF, which `--workspace` unifies away
  # (`just stable-tier-check`, `docs/API.md` §2.6).
  stable-tier:
    name: default features (no unstable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: just stable-tier-check
        run: just stable-tier-check

  # `just doc`: rustdoc with warnings denied, at the docs.rs configuration.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just doc
        run: just doc

  # `just c-abi-check` (`docs/PHASE4.md` §6.1, §7 gate 4): Miri plus ASan.
  c-abi:
    name: C ABI (Miri + ASan)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just c-abi-check
        run: just c-abi-check

  # `docs/PHASE4.md` §6.2 and §4.4. `cbindgen` is installed pinned, not a workspace
  # dependency (0007, MPL-2.0); the recipe fails on a missing `clang`.
  c-surface:
    name: C header + CMake package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: install cbindgen
        run: cargo install cbindgen --locked --version 0.29.4
      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: just c-header-check
        run: just c-header-check
      - name: just cmake-check
        run: just cmake-check

  # The Python suite on 3.14 and 3.14t (`docs/PHASE3.md` §7.3).
  python:
    name: python bindings (pytest, 3.14 + 3.14t)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just py-setup
        run: just py-setup
      # Runs the README snippet; before the suite so a broken quickstart is not masked.
      - name: just quickstart
        run: just quickstart
      - name: just py-lint
        run: just py-lint
      - name: just py-test
        run: just py-test
      - name: just py-test-freethreaded
        run: just py-test-freethreaded

  # CI sets `-Zmiri-strict-provenance`, which the recipe appends to
  # (`docs/decisions/0017`); both architectures (`PHASE1.md` §13).
  miri:
    name: miri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      MIRIFLAGS: "-Zmiri-strict-provenance"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - name: just miri
        run: just miri
      # The `compile_fail,E0277` pins need nightly rustdoc.
      - name: just test-doc-error-codes
        if: matrix.os == 'ubuntu-latest'
        run: just test-doc-error-codes

  # The only container job (ROS 2). `tf2-differential` and `tf2-replay` run in
  # `nightly.yml`; `tf2-bench` and `tf2-scaling` run in no workflow.
  tf2:
    name: tf2 bridge (container)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just tf2-check
        run: just tf2-check

      # `just ros-build` and `just ros-test` are `ros/tf_tree_ros`'s entire gate.
      - name: just ros-test
        run: just ros-test

  # `shm` is off by default, so `lint` and `test` compile none of it.
  shm:
    name: shared memory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is required: x86-64's near-TSO hides the bugs A1 and A5 fix.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: cargo fmt --check (shm sources)
        run: cargo fmt --all -- --check
      - name: just shm-check
        run: |
          just shm-check
          just shm-rendezvous

      # `docs/PHASE5.md` §5.1 (NORMATIVE) and §13 box 4.
      - name: install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - name: just no-network
        run: just no-network

      # PHASE2 §12.3 criterion 4. `may-refuse`: exit 2 warns instead of failing
      # (`scripts/gate-run.sh`).
      - name: just gate reclaim-latency may-refuse
        run: just gate reclaim-latency may-refuse

      - name: gate-run self-test
        run: ./scripts/gate-run.sh --self-test

  # The model checker (`PROJECT.md` §6); aarch64 is corroboration.
  loom:
    name: loom (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just loom
        run: just loom

  # `docs/PHASE5.md` §10: compares against `crates/tf_tree_bench/baseline/results.json`.
  # A green tick is not a performance claim; the gate is `just bench-check` locally.
  bench-gate:
    name: benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      # Debug clippy/test pass for `bench-probe` and `tf_tree_bench::embed`'s driver.
      - name: just embed-cost-check
        run: just embed-cost-check
      # `embed-cost` pins the probe with `taskset -c 2`; do not unpin, it changes the
      # baseline's conditions.
      - name: just bench-check
        run: just bench-check
        # Escape for `embed-cost`'s red collapse self-check (`Plan::at_tagged` has no
        # `#[inline]`, `docs/API.md` §2.3); delete with the recipe's branch.
        env:
          EMBED_COST_KNOWN_COLLAPSED: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-report
          path: target/bench-report/
