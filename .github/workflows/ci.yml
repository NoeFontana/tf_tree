# **Every job in this file is a thin wrapper around a `just` recipe, and that
# shape is the point of the file.** The recipe run locally, on a stated
# architecture, is the first gate; this workflow is the second opinion. A job
# that re-spells a recipe's lines instead of invoking it is a defect here, not a
# style preference — `just lint`'s `-p tf_tree_c --features test-hooks` clippy
# row once lived in no workflow at all because a job had transcribed five of six
# lines, and the `msrv` job below carries a longer version of the same story.
#
# **CI is real again, and what it found on its return is why it is worth
# running.** Actions produced no run for this repository between 2026-07-23 and
# 2026-08-16 — an account-level state on private repositories, confirmed rather
# than inferred when making the repository public restored runs immediately, and
# visible throughout in that GitHub-managed Dependabot runs never stopped while
# *user* workflows did. Not one job in this file had ever executed. The first
# runs after it returned found three latent bugs that no local gate had ever
# been in a position to see: `c_char` signedness on aarch64 (`i8` vs `u8`, six
# casts and two hard type errors), an exported symbol in no header tier, and a
# container with no writable `ROS_HOME`. The first-ever run of `nightly.yml`, on
# 2026-08-17, found two more.
#
# So a green check is evidence again — **but only of what the jobs cover.** The
# outage is over; the reason the recipes came first is not. `just` is still what
# gates a change before it is pushed, and everything that a shared runner cannot
# measure honestly (`bench-check`'s pinned probe below, every timing recipe in
# the justfile) is still gated on a host, by hand.
#
# **On aarch64, specifically.** The `ubuntu-24.04-arm` rows in the `test` and
# `shm` matrices had never executed in the life of the project; they now run and
# pass. That is *execution*, not a weak-memory proof. aarch64 reorders more than
# x86-64, so it can surface a missing barrier — a green run is not evidence one
# is absent. `just loom` remains the argument; these rows are corroboration.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **`just lint`, not a transcription of two of its lines.**
  #
  # This job used to run `cargo fmt --all -- --check` and `cargo clippy
  # --workspace --all-targets` directly. `just lint` is those two plus **seven**
  # more clippy invocations. Counted off the recipe body rather than remembered:
  # it runs eight `cargo clippy` commands, of which the `--workspace` one is the
  # line this job already had. (`grep -c 'cargo clippy'` says 9 — one of those
  # is a *comment* quoting the workspace command, which is why the count is
  # taken from the executed lines.)
  #
  # **This paragraph said five and six until it was corrected here.** `pure-hash`
  # (#243) added two rows and neither this comment nor CLAUDE.md's table was
  # updated, so a count explicitly labelled "counted, not remembered" drifted
  # anyway — which is the argument for the recipe being the single source and
  # these numbers being prose that any reader should re-count.
  #
  # Each of the seven exists because a default-off (or default-*on*) feature
  # makes a file invisible to `--workspace`: `-p tf_tree_c --features bridge`,
  # `-p tf_tree_c --features test-hooks`, `-p tf_tree_ingest --features fixture`,
  # `-p tf_tree_ingest --no-default-features`, `-p tf_tree_cli
  # --no-default-features`, and `--features pure-hash` for each of
  # `tf_tree_core` and `tf_tree`. One of them —
  # `-p tf_tree_c --features test-hooks` — ran in **no workflow at all** under
  # the old spelling, and the justfile records that a real warning had been
  # sitting in `publish.rs` unseen. Running the recipe is what makes CLAUDE.md's
  # "CI mirrors these recipes 1:1" true rather than aspirational.
  #
  # `just lint` also depends on `no-build-output`, which rejects any tracked file
  # carrying a cargo build-output signature. It runs first because it is the
  # cheapest thing in the recipe and because 358 MiB of `target-*` directories
  # reached `main` through three green runs of this very job.
  #
  # And on `no-conflict-markers`, for the same reason one job later: an
  # unresolved `<<<<<<< Updated upstream` reached `main` inside
  # `docs/decisions/README.md`'s status table, and **this job was green on it**,
  # along with the other seventeen. A rebase on a dirty worktree autostashed,
  # popped into a conflict after reporting success, and the markers were staged
  # in the same command. `artifact-versions` reads that exact table and counts
  # cells per row; a conflict marker is not a row.
  #
  # `just lint` depends on `py-compile`, which compiles the workspace-excluded
  # `tf_tree_py` against `.venv`'s interpreter or, failing that, the one on
  # `PATH` — so on this runner, which has no `.venv`, the dependency is a real
  # gate rather than the loud skip it used to be. The `bindings` job below runs
  # the same recipe against a pinned interpreter; see its comment for why both.
  # `lint` also depends on `evidence-audit` and `artifact-versions`, which is
  # why neither has a job of its own: 0.81 s and 0.09 s respectively, and both
  # are pure text checks over the checkout.
  #
  # **`just audit`, not `EmbarkStudios/cargo-deny-action`.** The old note here
  # said the action stays because it supplies the binary and the recipe is one
  # line either way. The first half stopped being a reason once this job grew a
  # `taiki-e/install-action` step, which lists `cargo-deny` among its tools
  # (checked against that repository's `TOOLS.md`, the same way the `c-surface`
  # job below establishes that `cbindgen` is *not* in it). The second half was
  # never a reason at all: one line is exactly how long `cargo fmt --all --
  # --check` is, and that line drifting out of a job is the defect this file
  # keeps finding. `deny.toml` is the configuration either way; what changes is
  # that a contributor's `just audit` and this step are now the same command.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - name: just lint
        run: just lint
      - name: just audit
        run: just audit

  # **The MSRV floor, enforced rather than intended** (`SUPPORT.md`, and
  # `docs/PHASE5.md` §10's "MSRV policy and a CI matrix pinning it").
  #
  # `rust-version` in the workspace manifest is a promise to every downstream
  # that this builds on that floor. Nothing in the other jobs checks it: they all
  # run `stable`, where a newer-than-floor method compiles perfectly and the
  # breakage is discovered by a user on an older toolchain.
  #
  # **This job used to transcribe `just msrv` instead of running it, and the
  # transcription was both short and wrong.**
  #
  # Short: the recipe has three arms and this job had two. The missing one greps
  # the prose a user actually reads — `README.md`, `SUPPORT.md`,
  # `crates/tf_tree/src/lib.rs` — for the floor, and it exists *because* README
  # said 1.85 while the manifest said 1.87 and both of the arms that were here
  # passed anyway. That arm therefore ran in no workflow at all.
  #
  # Wrong: the recipe builds with `cargo "+$want"`; the transcription dropped the
  # `+` and ran a bare `cargo build`. `rust-toolchain.toml` in this repository
  # pins `channel = "stable"`, and a directory's `rust-toolchain.toml` beats
  # `rustup default`, which is all `dtolnay/rust-toolchain` sets (its `action.yml`
  # runs `rustup default <toolchain>` and exports no `RUSTUP_TOOLCHAIN`). Measured
  # in the repository root:
  #
  #     $ rustup show active-toolchain -v
  #     stable-x86_64-unknown-linux-gnu
  #     active because: overridden by '/home/dev/src/tf_tree/rust-toolchain.toml'
  #
  # So the one step that was supposed to compile on the floor would have compiled
  # on `stable` — a green msrv job proving nothing about the MSRV. `cargo +1.87`
  # is unambiguous under every rustup precedence rule, and it is what the recipe
  # already spelled.
  #
  # What survives here is the one thing the recipe cannot do for itself: the
  # floor's toolchain has to exist before `cargo +$want` can use it, and the
  # recipe deliberately *fails* rather than falling back to `stable` when it does
  # not. So the version is still read from the manifest — never hardcoded, which
  # would drift from `rust-version` and pass while the promise was broken — and
  # handed to `dtolnay/rust-toolchain`, whose `rustup toolchain install` leaves it
  # named `<floor>-<triple>` for the recipe's `rustup toolchain list` check to
  # find. Everything after that is `just msrv`.
  #
  # The rest of the argument lives with the recipe, where a developer running it
  # will read it: `--lib --bins` and not `test`, the committed `Cargo.lock` used
  # as-is, and why the two workspace-excluded crates are compared rather than
  # compiled.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: read rust-version from the workspace manifest
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$v" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just msrv
        run: just msrv

  # `crates/tf_tree_py` is excluded from the workspace, so `cargo clippy
  # --workspace` above never compiles it. That gap shipped a real bug: a
  # `transmute::<EdgeWriter, Publisher>` that compiled only while the two types
  # happened to be the same size, and which silently dropped the claim lease and
  # the fork guard. It survived six PRs because nothing built the crate.
  #
  # Demonstrated against the historical bug itself. Restoring the cross-type
  # `transmute::<EdgeWriter, Publisher>` gives **4 errors from a clippy that
  # names the crate's own manifest and 0 from `cargo clippy --workspace`**,
  # because the workspace does not compile this crate at all — an error confined
  # to it is invisible, however loud.
  #
  # **The same crate, on the platforms the wheel matrix ships to.**
  #
  # `tf_tree_py` always enables `shm`, but the facade gates its whole
  # shared-arena surface on `#[cfg(all(feature = "shm", target_os = "linux"))]`
  # — so it is the *target*, not the feature, that decides whether `Open`,
  # `AttachMode`, `CreatePolicy` and `OpenError` exist. An unconditional import
  # of any of them compiles here and fails everywhere else.
  #
  # That is not hypothetical: it shipped. Both macOS and both Windows rows of
  # `wheels.yml` failed on the `v0.0.1` tag with `E0432`/`E0433`, which was the
  # first time that workflow had ever run — it triggers only on `v*`, so the
  # binding had never once been compiled off Linux. 0.0.1 has no wheel and
  # cannot have one.
  #
  # `cargo check` on native runners rather than a cross-compile from Linux:
  # blake3's build script needs a C toolchain for the target, so a cross-check
  # dies in a dependency before reaching this crate. Native runners have one.
  # It is a check, not a build — no Python, no linking, no wheel.
  bindings-non-linux:
    name: python bindings compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (tf_tree_py)
        run: cargo check --manifest-path crates/tf_tree_py/Cargo.toml --features pyo3/extension-module,pyo3/abi3-py39

  # **`just py-compile`, not a re-spelling of that recipe's two lines** — the
  # transcription this file keeps paying for. One other outlives it: the
  # `cargo check` in `bindings-non-linux` above, which no recipe spells either
  # and which is a separate change, not an exception to the rule. The job
  # could not invoke the recipe before, because the recipe skipped when there was
  # no `.venv`, which is this runner: it would have gated nothing. `py-compile`
  # now falls back to the interpreter on `PATH` — the one `actions/setup-python`
  # puts there — and carries the `cargo fmt` line as well, which nothing else in
  # CI covers for this crate: `just lint`'s `cargo fmt --all -- --check` reaches
  # workspace *members* only, and this one is excluded.
  #
  # Measured with a cheaper probe than the transmute above, on a checkout with no
  # `.venv`: a `v.len() == 0` appended to `crates/tf_tree_py/src/lib.rs` left
  # `cargo clippy --workspace --all-targets -- -D warnings` exiting 0, and took
  # `just py-compile` to exit 101.
  #
  # **The recipe now also runs in the `lint` job, as a dependency, and this job
  # stays anyway.** One spelling invoked twice is not two spellings, and the two
  # invocations are not the same compile: `pyo3-build-config` executes the
  # interpreter and emits a `Py_3_x` cfg for every version at or below it
  # (measured against 3.12 — `Py_3_8` through `Py_3_12`), so which Python is
  # found decides what is compiled. This job pins 3.13, the `python` job's
  # `just py-lint` gets uv's 3.14, and `lint` takes whatever the runner image
  # ships. It is also the only place the binding gate is named: were `lint`'s
  # dependency list ever trimmed, a job that ran in no workflow is precisely the
  # failure this file was rebuilt around.
  bindings:
    name: python bindings compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just py-compile
        run: just py-compile
      # **The cross-compile half, and it runs here because it can only run on
      # Linux.** `bindings-non-linux` checks macOS and Windows on *native*
      # runners, so it never needs `tf_tree_py`'s `pure-hash` feature and never
      # compiles it. This step is the only thing that does.
      #
      # What it guards is #180: `macos-15-intel` is the last x86_64 macOS image
      # Actions offers and it disappears in August 2027, at which point the
      # fallback is cross-building x86_64 from the arm64 runner. Measured, that
      # fallback needs seven things and six are now true; this keeps the one that
      # was a one-line diff from silently reverting.
      - name: just py-cross-check
        run: just py-cross-check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is a first-class target for the atomic-ordering guarantees;
        # run the suite there as well as on x86_64.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      # **`just test`, not its parts.** This job used to run `cargo nextest run
      # --workspace`, `cargo test --doc --workspace` and `just ingest-check` as
      # three separate steps. That is `just test` minus exactly one line —
      # `test-rust`'s `cargo nextest run -p tf_tree_c --features bridge`, which
      # covers the ten `extern "C"` entry points of the §5 ingest seam, the only
      # ones that both decide and write. Measured rather than asserted: that
      # command runs **60** tests where the default-feature build runs **31**,
      # so 29 tests existed and executed in no job here at all. `just
      # c-abi-check` runs the same target under Miri, and that recipe was in no
      # workflow either — see the `c-abi` job below.
      - name: just test
        run: just test

  # **`tf_tree` with `unstable` OFF — the tier every published consumer gets.**
  #
  # No `--workspace` job compiles the facade's own default feature set with the
  # feature off. `lint` and `test` both run `--workspace`, and cargo's resolver
  # unifies features across a workspace build, so `tf_tree_cli`, `tf_tree_c`,
  # `tf_tree_bench` and `tf_tree_py` — **four**, not three — each asking for
  # `tf_tree/unstable` turns the feature on for the facade everywhere: in
  # `cargo clippy --workspace`, in `cargo nextest run --workspace`, and in
  # `cargo build --workspace --all-targets`. A `-p tf_tree` selection is what
  # does not, which is what `just stable-tier-check` is made of.
  #
  # Note "no `--workspace` job" and not "no other job": `just miri` and
  # `just test-doc-error-codes` are `-p tf_tree` selections too and do reach
  # `FEATURES=counters,default`. What is unique here is the *set* of stable-tier
  # checks — three clippy configurations, the tier's own rustdoc, the consumer
  # scan and the test-count floor. `docs/API.md` §2.6 carries the measurement.
  #
  # This list is prose and nothing reads it: the recipe's scan compares
  # `docs/API.md` §6 row 4 and `crates/tf_tree/Cargo.toml`'s `unstable` comment
  # against the manifests, and never this file. That is exactly how it came to
  # say three.
  #
  # **The recipe was made to fail before this job was written.** Reintroducing
  # the branch's own defect — `self.arena_view()` where `frozen.rs` now calls
  # `self.view()` — leaves `cargo check --workspace --all-targets` and
  # `cargo check -p tf_tree --all-targets --features shm` both at exit 0, and
  # makes this recipe's second line report
  # `error[E0599]: no method named 'arena_view'`.
  #
  # Its own job rather than a step bolted onto `test` or `lint`, because it needs
  # `clippy` (which `test`'s toolchain does not install) *and* `cargo-nextest`
  # (which `lint`'s does not). Adding one binary to the other job is the
  # cheaper-looking change and is exactly how a gate comes to fail on a missing
  # tool instead of on the code.
  stable-tier:
    name: default features (no unstable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: just stable-tier-check
        run: just stable-tier-check

  # `just doc` — rustdoc with warnings denied, at the configuration docs.rs
  # builds. All five publishable crates now carry `all-features = true` and
  # `rustdoc-args = ["--cfg", "docsrs"]` in `[package.metadata.docs.rs]`;
  # `tf_tree_ipc` did not until this commit, so the recipe's own justification
  # for that flag was false for one of the crates it names. The four
  # `publish = false` crates on the recipe's first line are there because they
  # are public API to somebody — a C caller, an operator, the ROS node.
  #
  # This job previously spelled its own `cargo doc` line, covering six of the
  # workspace's eleven members and omitting `tf_tree_c`, `tf_tree_ingest`,
  # `tf_tree_bridge`, `tf_tree_bench` and `xtask`. It had never executed, so
  # none of it was enforced anywhere, and `cargo doc --no-deps --workspace` had
  # accumulated **80** warnings — 44 unresolved intra-doc links, 35 public items
  # linking to private ones, one redundant explicit target. All 80 are fixed and
  # the recipe is now the gate; it covers the five members this job missed.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just doc
        run: just doc

  # **`just c-abi-check` — `docs/PHASE4.md` §6.1 and §7 gate 4, which ran in no
  # workflow until this job existed.**
  #
  # The C ABI is the one place in the workspace where `unsafe` faces a caller
  # the compiler cannot see, and `tf_tree_c` is deliberately excluded from the
  # `miri` job below. So the four Miri targets this recipe runs — `abi`, `live`,
  # `publish` and the `bridge` seam, the last of which hands C a fistful of
  # `const char *` borrowed from the handle — plus the ASan pass had exactly one
  # gate: whoever remembered to type it. The justfile records that Miri caught a
  # real alignment UB here, in a *test* that claimed foreign pointers were
  # safely rejected.
  #
  # Its own job rather than a step on `miri`: `-Zbuild-std` for the ASan row is
  # a from-scratch standard library and pushes this past the wall-clock of
  # everything else in the file.
  c-abi:
    name: C ABI (Miri + ASan)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # `miri` for the four Miri rows; `rust-src` for the ASan row's
          # `-Zbuild-std`, without which a use-after-free inside `Box::from_raw`
          # is invisible.
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just c-abi-check
        run: just c-abi-check

  # **The two recipes that check the *header* and the *package* rather than the
  # crate — `docs/PHASE4.md` §6.2 and §4.4. Neither was in any workflow.**
  #
  # `c-header-check` is the only thing in this repository that compiles the
  # committed `crates/tf_tree_c/include/*.h`, and it is the only thing that
  # notices when they have drifted from `src/`. The justfile records the failure
  # mode concretely: a header with an unbalanced `#endif` shipped once and every
  # Rust test still passed.
  #
  # `cmake-check` builds a downstream project that reaches tf_tree only through
  # `find_package(tf_tree CONFIG)`. Three real packaging defects were invisible
  # until that consumer existed.
  #
  # **`cbindgen` is what this job was missing, and without it the job could not
  # have passed on any runner.** `just c-header-check`'s first line is
  # `cargo xtask headers --check`, which *generates* both headers with the
  # `cbindgen` binary before diffing them against the committed files — so a
  # missing binary is not a skipped regeneration, it is `exit 1` before the
  # compile matrix runs at all. Reproduced locally by removing `cbindgen` from
  # `$PATH`:
  #
  #     xtask headers: could not run `cbindgen`: No such file or directory (os error 2)
  #     error: Recipe `c-header-check` failed with exit code 1
  #
  # It cannot come from `taiki-e/install-action` — `cbindgen` is not in that
  # action's tool list (checked against its `TOOLS.md`) — and it deliberately is
  # not a workspace dependency (`docs/decisions/0007`: MPL-2.0 against
  # `deny.toml`'s allowlist), so `cargo install` is the route. Pinned: the check
  # compares generated text against a committed file, so an unpinned install
  # makes cbindgen's release cadence a PR-blocking input. The pin is not papering
  # over a known incompatibility — 0.28.0 and 0.29.4 were both measured to
  # reproduce the committed headers byte-for-byte.
  #
  # `clang` is installed explicitly even though `ubuntu-24.04` preinstalls it
  # (the image's `install-clang.sh` runs `update-alternatives` for unversioned
  # `clang`/`clang++`, so §6.2's second compiler is there today). The step stays
  # because `just c-header-check` does not skip a missing compiler, it fails on
  # it, and an image change should not be able to turn a two-compiler matrix into
  # a one-compiler one.
  c-surface:
    name: C header + CMake package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: install cbindgen
        run: cargo install cbindgen --locked --version 0.29.4
      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: just c-header-check
        run: just c-header-check
      - name: just cmake-check
        run: just cmake-check

  # **The Python suite, which ran in no workflow.**
  #
  # The `bindings` job below compiles `tf_tree_py` and lints it; nothing
  # anywhere executed a single `pytest`. `docs/PHASE3.md` §7.3 requires the
  # suite to pass on **both** interpreters — 3.14 and the free-threaded 3.14t —
  # and that is exactly the claim `tf_tree_py`'s `gil_used = false` rests on.
  # The `wheels` workflow builds wheels and never runs a test against one.
  #
  # `just py-setup` provisions both interpreters through uv, so the floors in
  # §10.1 are what actually gets used rather than whatever the runner ships.
  python:
    name: python bindings (pytest, 3.14 + 3.14t)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just py-setup
        run: just py-setup
      # **`just quickstart` — the README's documented first five minutes, which
      # ran in no workflow.** CLAUDE.md's command table lists it as a gate; it
      # was one only for whoever typed it. It executes the `## First five
      # minutes` snippet *out of `README.md`* and compares stdout against the
      # `# ->` marker in the snippet itself, so it fails when an API change makes
      # the documentation a reader follows stop working — which is a per-PR
      # concern, not a nightly one, because the documentation drifts on the same
      # commits the API does.
      #
      # It is here, in this job, rather than in one of its own, because that is
      # what makes it nearly free. Cold it needs uv, two CPython interpreters and
      # a from-scratch `maturin develop` — all of which this job has already paid
      # for by the step above. Measured on x86-64 with those already in place:
      #
      #     $ /usr/bin/time -f "%e s" just quickstart
      #     0.72 s          (warm; the smoke script alone is 0.10 s)
      #
      # and 7.11 s from no `.venv`/`.venv-t` at all with uv's download cache
      # warm, which is the closest local approximation of a cold runner and still
      # an underestimate of one.
      #
      # Before `just py-lint` and `just py-test` deliberately: it is the step a
      # newcomer's experience depends on, and putting it after the suite would
      # mean a broken quickstart is only ever reported behind a test failure.
      - name: just quickstart
        run: just quickstart
      - name: just py-lint
        run: just py-lint
      - name: just py-test
        run: just py-test
      - name: just py-test-freethreaded
        run: just py-test-freethreaded

  # **CI is the stricter of the two runs, and it now gets there by adding a flag
  # to the recipe rather than by retyping the recipe.**
  #
  # This job used to spell both `cargo miri test` lines out again so it could put
  # `-Zmiri-strict-provenance` in front of them, and the reason it had to was one
  # word in the justfile: the second line assigned `MIRIFLAGS=` outright, so
  # anything the environment set was discarded and there was no way to ask for
  # provenance checking without losing `-Zmiri-disable-isolation`. The recipe now
  # appends to `${MIRIFLAGS:-}` instead, so the flag can be set here, at the job
  # level, and the recipe stays the single spelling of *which* targets are
  # interpreted under Miri. Which matters: `docs/decisions/0017` says a second
  # `unsafe` in `tf_tree` adds its target to that `--test` list, and under the old
  # arrangement it would have been added in one place and silently not run in the
  # other.
  #
  # A green `just miri` on a developer's machine still does not imply a green job
  # here — `MIRIFLAGS` is unset locally and provenance checking is off. That
  # asymmetry is deliberate and unchanged; what changed is that it is now the only
  # difference between the two, instead of one difference among however many a
  # transcription had accumulated.
  miri:
    name: miri
    runs-on: ubuntu-latest
    # Both of the recipe's lines, and only this job sets it. The recipe appends
    # its own `-Zmiri-disable-isolation` to whatever is here.
    env:
      MIRIFLAGS: "-Zmiri-strict-provenance"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - name: just miri
        run: just miri
      # The two `compile_fail,E0277` pins. Stable rustdoc parses the error code
      # and ignores it, so `just test-doc` cannot enforce them; this job already
      # has the nightly toolchain that can. Seconds, and it is here rather than
      # in `test` because that is the only place the toolchain exists.
      - name: just test-doc-error-codes
        run: just test-doc-error-codes

  # The only job that needs a container, because it is the only job that needs
  # ROS 2. `tf_tree_tf2_sys` is excluded from the workspace (it links `-ltf2`, so
  # it does not build on a plain runner), which also excludes it from the `lint`
  # and `test` jobs above: their `--workspace` never sees its `unsafe`, its
  # clippy lints or its unit tests. Nor do they see anything behind
  # `tf_tree_bench`'s `tf2` feature. This job is where all of that is checked.
  #
  # It builds `docker/tf2/` on every run (a ROS 2 base image plus a rustup
  # toolchain, several minutes) and it is deliberately the same `just` recipe a
  # developer runs locally — CI mirrors the recipes 1:1 rather than restating
  # the commands.
  #
  # The heavier tf2 recipes stay off *this* workflow, and they split two ways.
  # `tf2-differential` and `tf2-replay` are tests, not measurements, so they run
  # on a schedule instead of on every pull request — `nightly.yml`'s
  # `tf2-differential` job is where, and it is the only place they run. They are
  # here in comment form so that "excluded from PRs" cannot quietly become
  # "excluded from everything", which is what it was until that job existed.
  # `tf2-bench` and `tf2-scaling` are in no workflow at all and should not be:
  # they are timings, which a shared runner cannot produce meaningfully.
  tf2:
    name: tf2 bridge (container)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just tf2-check
        run: just tf2-check

      # `ros/tf_tree_ros` is an `ament_cmake` package outside the cargo
      # workspace, so `lint` and `test` above compile none of it: not the
      # subscriptions, not the QoS §5.2 is NORMATIVE about, not the four ctest
      # binaries. CLAUDE.md says "`just ros-build` and `just ros-test` are its
      # entire gate" — this is where that gate runs. It reuses the image the
      # step above already built, so the marginal cost is the colcon build and
      # the ctests.
      - name: just ros-test
        run: just ros-test

  # The `shm` feature is off by default, so `lint` and `test` above compile none
  # of it: not `MappedArena`'s ~390 lines of syscall-facing `unsafe`, not the
  # multi-process gate, not the shm benchmarks. Without this job that code is
  # neither clippy'd nor executed anywhere in CI. Linux-only by construction
  # (`memfd_create` + `F_ADD_SEALS`), which is why it is not in the `test`
  # matrix.
  shm:
    name: shared memory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is not optional here. A1 and A5 are *ordering* fixes, and the
        # whole atomics discipline exists for weak memory models — x86-64's
        # near-TSO would hide exactly the bugs they prevent.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # 20 until `just no-network` joined it: that recipe builds `tf_tree_cli`'s
    # test targets for its positive control, which no other step in this job
    # needs, and then traces the library's test binaries single-threaded under
    # `strace -f`. (A binary count stood here; the recipe prints its own.)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Declared, not inherited. `dtolnay/rust-toolchain` installs with
          # `--profile minimal`, and this job runs `cargo fmt` below and five
          # `cargo clippy` lines inside `just shm-check`. They work today only
          # because the runner image happens to `rustup component add rustfmt
          # clippy` after its own minimal install; an image that stopped would
          # turn this job into `error: no such command: clippy`.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: cargo fmt --check (shm sources)
        run: cargo fmt --all -- --check
      - name: just shm-check
        run: |
          just shm-check
          just shm-rendezvous

      # **`docs/PHASE5.md` §5.1's NORMATIVE assertion, and §13's box 4.** It
      # lives on this job rather than on a job of its own because it needs
      # exactly what this one already has: a Linux runner and the `shm` feature
      # compiled in. Without `shm` the Phase 2 rendezvous — the one socket the
      # library is *supposed* to open — is not built, and the recipe refuses a
      # run in which it was never traced rather than reporting a green scan over
      # a suite that opened nothing.
      #
      # `strace` is installed explicitly rather than assumed. It is present on
      # today's `ubuntu-latest` image, which is precisely the reason to name it:
      # an image that dropped it would turn this assertion into a refusal on
      # every run, and the refusal is correct but the diagnosis would be a
      # runner change rather than a code one. `apt-get` here is environment
      # setup, the same shape as the `c-surface` job's `clang`, and the check
      # itself is the recipe.
      #
      # Both matrix rows run it. aarch64 is not corroboration here the way it is
      # for the ordering claims: `socket(2)`'s family argument is not an
      # architecture question. What the second row buys is that the *assertion*
      # keeps working under the runner this project actually ships on, and it
      # costs ~25 s.
      - name: install strace
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - name: just no-network
        run: just no-network

  # Spelled as the recipe rather than as its body. It is one line either way,
  # and it is the *argument* half of the weak-memory defence — the aarch64 rows
  # above now execute and pass, but a green run on hardware corroborates an
  # ordering claim and does not prove one. This is the model checker, so it
  # should be impossible for it to drift from what a developer runs.
  loom:
    name: loom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just loom
        run: just loom

  # `docs/PHASE5.md` §10: "the benchmark artifact as a regression gate".
  #
  # Runs `just bench-check`, which regenerates the §9 artifact and compares it
  # against `crates/tf_tree_bench/baseline/results.json`. Deliberately
  # single-runner and `ubuntu-latest` only: the comparison ignores host facts by
  # construction (`crates/tf_tree_bench/src/baseline.rs`), so an extra
  # architecture would re-run the same one host-independent claim.
  #
  # **A green tick here is not evidence of a performance claim**, and that is
  # true now that runs happen rather than in spite of it. A shared runner's
  # neighbours are not observable from inside it, so a timing measured here
  # answers a different question from the one the baseline was cut against; the
  # gate is `just bench-check`, run locally on the arch stated in the PR. See the
  # `bench-check` step below for why this job cannot pass on a hosted runner at
  # all today.
  bench-gate:
    name: benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `just embed-cost-check` below opens with `cargo fmt --check` and two
          # `cargo clippy` lines; see the `shm` job for why these are named
          # rather than inherited from the runner image.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      # `--workspace` builds default features, so `tf_tree_core/bench-probe` and
      # the half of `tf_tree_bench::embed` that drives it are compiled out of
      # `just test` — the same hole `shm` has, and this is its `shm-check`. It is
      # a debug clippy/test pass over one crate and builds no extra profile tree.
      - name: just embed-cost-check
        run: just embed-cost-check
      # `bench-check` depends on `just embed-cost`, so this step also builds the
      # `[profile.embedder]` tree (166 MiB, ~10 s measured locally) and runs the
      # probe under `taskset -c 2` — which needs a runner with at least three
      # logical CPUs.
      #
      # **This comment used to say the job could not pass on a hosted runner, and
      # execution refuted it.** The argument was that GitHub's standard Linux
      # runner is 4 vCPU for a public repository and 2 for a private one, and
      # `tf_tree` was private, so CPU 2 would not exist. `tf_tree` is public now —
      # that is how the Actions outage was confirmed — and the prediction was
      # tested rather than re-reasoned about:
      #
      #     gh run view --job 95381266134   # ci.yml run 32027957136, 2026-08-17
      #     just embed-cost-check  success
      #     just bench-check       success   (embedder 323.5 ns, release 250.0 ns)
      #
      # `taskset -c 2` ran and the pin held. The refuted expectation is left in
      # place rather than deleted because it is the reason the probe is pinned at
      # all: if this repository ever goes private again the row stops being
      # producible, and the fix is *not* to unpin (an unpinned run cannot resolve
      # §9.2's 5 %) nor to pick the CPU dynamically (that changes the conditions
      # `crates/tf_tree_bench/baseline/results.json` was cut under, which is a
      # benchmarking decision and not a CI one).
      #
      # The dependency itself is not optional: `bench-baseline-update` records the
      # row, and a baseline row the check cannot produce is a permanent failure.
      - name: just bench-check
        run: just bench-check
      # The artifact itself, so a failing gate can be inspected rather than
      # re-derived. `bench_report` writes it before comparing, precisely so it
      # survives the failure.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-report
          path: target/bench-report/
