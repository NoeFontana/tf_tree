# Wheel matrix — `docs/PHASE3.md` §10.
#
# Two maturin invocations per platform row, and that is not an accident of the
# scripting: maturin emits **at most one stable-ABI family per invocation**
# (PyO3/maturin#3226). Selection happens after interpreter resolution — `abi3t`
# when a CPython >= 3.15 interpreter is present, otherwise `abi3` — so `abi3`
# and `abi3.abi3t` cannot come out of the same build. A single job with an extra
# flag would silently produce only one of them.
#
# `cp313t` is deliberately absent (§1.1): PyO3 0.29 refuses to build for 3.13t,
# manylinux dropped it from its images, and `--find-interpreters` skips it. That
# is the right outcome rather than a loss — 3.13t was PEP 703's experimental
# phase; free-threading became *supported* in 3.14 under PEP 779.
#
# NOTE: this workflow has never executed. GitHub Actions has produced no run for
# this repository since 2026-07-23 (see #24). The cause is now diagnosed rather
# than suspected and is written up in `ci.yml`'s header: user-workflow runs
# stopped on every one of this account's **private** repositories at once
# (2026-07-23 to 2026-07-24) while its **public** ones kept running, which is an
# account-level Actions billing state — not a trigger, not a runner, and not
# anything this file can fix. Treat the first real run as unproven.
#
# **Nothing here tests a wheel.** These jobs build and (on a tag) publish; the
# suite that would run against the artifact is `ci.yml`'s `python` job, which
# builds its own extension with maturin. A wheel that imports but computes the
# wrong transform would leave this workflow green.
name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Row 1 of §10's matrix: the stable-ABI wheel, one per platform.
  abi3:
    name: abi3 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          # **`macos-15-intel`, not `macos-13`.** The macOS 13 image was retired
          # on 2025-12-04; a job requesting it does not fail, it **queues
          # forever** against a label no runner carries. That is how it
          # presented here — the `v0.0.2` wheel matrix sat with one row
          # `queued` and no runner assigned while every other row had long
          # since passed, holding the PyPI publish (which `needs` the whole
          # matrix) indefinitely.
          #
          # `macos-15-intel` is the successor and **the last x86_64 macOS image
          # Actions will offer** — GitHub retires the architecture entirely in
          # autumn 2027. When that lands, this row goes away and macOS is
          # arm64-only; `macos-latest` above already covers Apple Silicon.
          - { os: macos-15-intel, target: x86_64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # `abi3-py39` covers every GIL build from 3.9 up in one artifact.
          args: --release --out dist --features pyo3/extension-module,pyo3/abi3-py39
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-abi3-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  # Row 2: the free-threaded wheel. Version-specific by necessity — abi3 does
  # not cover free-threaded builds, and PEP 803's `abi3t` needs 3.15.
  freethreaded:
    name: cp314t ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # No abi3 feature: it is ignored on a free-threaded build and the
          # wheel would be rejected by the interpreter anyway (§1.1).
          args: --release --out dist --features pyo3/extension-module --interpreter python3.14t
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-cp314t-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  # Row 3: PEP 803's combined stable ABI. Written now, skipped until CPython
  # 3.15 ships — PyO3 0.29 and maturin 1.14.1 already do their halves, so the
  # only unmet precondition is the interpreter (§1.1, corrected in #25).
  #
  # Having the job written is the difference between a same-week and a
  # same-quarter response when 3.15 lands.
  abi3t:
    name: abi3.abi3t (awaiting CPython 3.15)
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: PyO3/maturin-action@v1
        with:
          manylinux: "2_28"
          args: >-
            --release --out dist
            --features pyo3/extension-module,pyo3/abi3-py315,pyo3/abi3t-py315
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-abi3t
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  # Publishing is deliberately a separate, tag-only job.
  #
  # PEP 740 attestations are produced by the *upload* step under Trusted
  # Publishing, not by `maturin build` — maturin adopting them for its own
  # releases is precedent for the workflow shape, not a feature inherited by
  # building with it (§10, corrected in #25).
  # **A tag *or* a manual dispatch, and the second is a recovery path rather
  # than a convenience.** crates.io and PyPI publish from the same tag but not
  # atomically: `release.yml` succeeded for `v0.0.2` while this matrix was still
  # blocked on a retired runner label, so crates.io had 0.0.2 and PyPI had
  # nothing, with no way to finish the release short of burning a version
  # number or moving a tag that a published crate records the sha of.
  #
  # `workflow_dispatch` is already privileged — it needs write access — and the
  # `pypi` environment gates it on top, so allowing it to publish adds no path
  # an untrusted actor can take. What it adds is the ability to complete a
  # half-published release from the same commit.
  publish:
    needs: [abi3, freethreaded, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # Trusted Publishing
      attestations: write  # PEP 740
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          # **Because a partial upload is a state this workflow can reach.**
          # twine uploads file by file; if PyPI refuses one, the files before it
          # are already published and the version cannot be re-cut. 0.0.2 landed
          # exactly there — eleven wheels accepted, then the sdist refused with
          # `400 License-File LICENSE-APACHE does not exist in distribution`.
          #
          # Without this, the dispatch that completes such a release fails on
          # the first already-published wheel and never reaches the missing
          # file. Rebuilt wheels are not byte-identical to the uploaded ones, so
          # "upload only what is new" is not something the matrix can decide.
          #
          # It is narrow: PyPI still refuses a *different* file under an
          # existing name, so this cannot overwrite a published artifact — it
          # only declines to treat "already there" as an error.
          skip-existing: true
