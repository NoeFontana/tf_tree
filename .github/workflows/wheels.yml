# Wheel matrix (`docs/PHASE3.md` §10). Two maturin invocations per platform row:
# maturin emits at most one stable-ABI family per invocation (PyO3/maturin#3226).
# `cp313t` is absent by design (§1.1).
# Nothing here tests a wheel; `ci.yml`'s `python` job runs the suite.
name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Row 1 of §10's matrix: the stable-ABI wheel, one per platform.
  # `timeout-minutes` bounds a hung build, not queue time: a row on a retired runner
  # label queues for 24 h, then is cancelled, and `publish` skips (#180).
  abi3:
    name: abi3 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          # `macos-15-intel` is the last x86_64 macOS image (available until August
          # 2027, actions/runner-images#13045); remove this row then. A retired label
          # queues silently rather than failing.
          - { os: macos-15-intel, target: x86_64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # `abi3-py39` covers every GIL build from 3.9 up in one artifact.
          args: --release --out dist --features pyo3/extension-module,pyo3/abi3-py39
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-abi3-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  # Row 2: the free-threaded wheel. Version-specific by necessity — abi3 does
  # not cover free-threaded builds, and PEP 803's `abi3t` needs 3.15.
  freethreaded:
    name: cp314t ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # No abi3 feature: it is ignored on a free-threaded build and the
          # wheel would be rejected by the interpreter anyway (§1.1).
          args: --release --out dist --features pyo3/extension-module --interpreter python3.14t
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-cp314t-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  # Row 3: PEP 803's combined stable ABI; skipped until CPython 3.15 ships.
  abi3t:
    name: abi3.abi3t (awaiting CPython 3.15)
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: PyO3/maturin-action@v1
        with:
          manylinux: "2_28"
          args: >-
            --release --out dist
            --features pyo3/extension-module,pyo3/abi3-py315,pyo3/abi3t-py315
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-abi3t
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # PyPI forbids re-uploading a version, so assert the tag matches `pyproject.toml`
      # (`release.yml` does the same for the workspace).
      - name: assert the tag matches the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          proj="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=${tag} pyproject=${proj}"
          if [[ "$tag" != "$proj" ]]; then
            echo "::error::tag v${tag} does not match pyproject.toml version ${proj}" >&2
            exit 1
          fi

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      # PyPI rejects an sdist whose `License-File:` metadata names a file the archive
      # lacks (0.0.2); check it here, before any wheel is uploaded.
      - name: every License-File named in the metadata is in the archive
        run: |
          set -euo pipefail
          tarball=$(ls dist/*.tar.gz)
          root=$(basename "$tarball" .tar.gz)
          echo "checking $tarball"
          declared=$(tar -xOzf "$tarball" "$root/PKG-INFO" | sed -n 's/^License-File: //p')
          # An empty `declared` is a failure, not a pass: the check would have nothing to compare.
          if [ -z "$declared" ]; then
            echo "::error file=pyproject.toml::PKG-INFO in $tarball declares no 'License-File:' header at all, so this check has nothing to compare and the sdist carries no required licence file. Apache-2.0 4(a) is what makes that a defect rather than a formality." >&2
            exit 1
          fi
          contents=$(tar -tzf "$tarball")
          rc=0
          while IFS= read -r f; do
            if grep -qxF "$root/$f" <<<"$contents"; then
              echo "  ok      $f"
            else
              echo "::error file=pyproject.toml::PKG-INFO declares 'License-File: $f' but $root/$f is not in the sdist. PyPI will reject the upload with 400. Add it to [tool.maturin] include."
              rc=1
            fi
          done <<<"$declared"
          exit $rc

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  # Tag-only publish, or a manual dispatch to finish a half-published release
  # (crates.io and PyPI publish from one tag, not atomically). Dispatch needs write
  # access and the `pypi` environment gates it. PEP 740 attestations come from the
  # upload step (§10).
  publish:
    needs: [abi3, freethreaded, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write      # Trusted Publishing
      attestations: write  # PEP 740
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          # A partial upload is reachable (0.0.2); skip-existing lets a re-dispatch
          # reach the missing file. PyPI still refuses a different file under an
          # existing name.
          skip-existing: true
