name: nightly

# **Why these jobs are nightly and not per-PR.** `docs/PHASE5.md` §10's CI list
# asks for two things that do not belong on a pull request: the `shm_torture`
# soak (`docs/PHASE2.md` §13 spells it "30 minutes nightly, clean, under ASan")
# and the sanitizer suites, which need a nightly toolchain and `-Zbuild-std` and
# therefore take tens of minutes. `tf2-differential` and `tf2-replay` are here
# for the same reason — minutes of container work each — and `cpp-check` because
# it builds the header-only wrapper twice under two sanitizers. None of them is
# cheap enough to sit between a contributor and a merge; all of them are things
# that must not be allowed to rot.
#
# **This file ran for the first time on 2026-08-17, and two of the five jobs it
# had then failed.** That is the entry that matters, and it replaces the
# paragraph that used to be here: from 2026-07-23 to 2026-08-16 no user workflow on this
# repository produced a run at all — an account-level Actions state on private
# repositories, confirmed rather than inferred when making the repository public
# restored runs immediately — so every job below had been written, reviewed and
# never once executed. The first execution is what found the two failures.
#
# The history is kept because the conclusion drawn from it is still the design of
# this file: every job here is a thin wrapper that *invokes* a `just` recipe
# rather than restating its commands, and the recipe run locally, on a stated
# architecture, is the gate this workflow corroborates. That ordering — recipes
# first, jobs second — is what made those three-and-a-half weeks cost corroboration
# rather than the ability to check anything at all, and it is why a job here is
# never allowed to grow a command that no recipe contains.
#
# What a green tick here is now evidence of: that these recipes passed on a
# GitHub-hosted x86-64 runner, once, on the tree that was scheduled. Nothing
# about aarch64 (`ci.yml` has those rows) and nothing about a run that did not
# happen — a schedule that stops firing still looks exactly like one that passes.

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: the hour is when every scheduled
    # workflow on the platform starts, and a queued job that never runs is
    # indistinguishable from a passing one.
    - cron: "17 3 * * *"
  # So a change to these recipes can be exercised without waiting a day.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  torture:
    name: shm_torture (30 min)
    runs-on: ubuntu-latest
    # The recipe's own duration is 30 minutes; the margin covers the release
    # build and the teardown. Left explicit so a hung run is killed by the job
    # rather than by the 6-hour default.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      # The seconds-long self-test first. If the harness's detector is broken,
      # thirty minutes of it would pass and mean nothing, and finding that out
      # after thirty minutes is worse than finding it out after ten seconds.
      - name: just shm-torture-self-test
        run: just shm-torture-self-test
      - name: just shm-torture
        run: just shm-torture

  # **`docs/PHASE2.md` §11.4's other half — "a random crash point armed in 10%
  # of children" — which ran in no workflow at all.**
  #
  # The `torture` job above is the `SIGKILL` half. §11.4 asks for both, and
  # `SIGKILL` lands wherever the scheduler puts it: a real fault, and a much
  # shallower set of mid-protocol states than §11.3's named ones. `just
  # shm-torture-crash-points` arms a random site from
  # `tf_tree_core::crash::SITES` and `tf_tree::CRASH_SITES` in about a tenth of
  # children, so the run kills processes *at named instructions*. Until this job
  # existed, that clause was measured by whoever remembered to type the recipe,
  # and the number quoted for it came from a hand measurement in a justfile
  # comment — a measurement with a date on it, not a gate.
  #
  # **Its own job rather than a row on `torture`, for two reasons that are both
  # about not sharing.** The build is different: `--features shm,crash-points`,
  # which the plain soak deliberately does not carry (a site compiled out of the
  # driver is compiled out of every child, and the flag would arm nothing while
  # looking like it had). And the parameters are different on purpose — 5
  # minutes, 10 children, 2 Hz, longer and gentler than the soak's 30/6/6,
  # because a high kill rate wins the race against the site more often than not.
  # A matrix row would have to carry both, and the `gate4` job's argument
  # applies as well: a five-minute run must not go unrun on a night the
  # thirty-minute one fails early.
  #
  # **What makes the exit status worth reading.** The binary refuses a
  # `--crash-points` run that armed nothing, and separately one that armed
  # children and fired at none — because this job reads the status and nothing
  # else, while the `§11.3:` line it prints was written for a human. Without
  # those two refusals this job would be the vacuous green that
  # `crates/tf_tree_bench/tests/torture.rs`'s
  # `a_run_that_validates_nothing_fails_instead_of_passing` exists to prevent
  # one level down.
  #
  # **25 minutes, and the number is what the two steps below cost rather than
  # what the soak costs.** The soak itself is 5 minutes. Around it are *two*
  # release builds that cargo cannot share, because `crash-points` is a
  # passthrough to `tf_tree/crash-points` and `tf_tree_core/crash-points`
  # (`crates/tf_tree_bench/Cargo.toml`), so the feature set differs all the way
  # down: `--features shm --release` for `just shm-torture-self-test`, and
  # `--features shm,crash-points --release` for `just shm-torture-crash-points`.
  # The `shm,crash-points` build is produced by no other job in this file; the
  # `shm` one is also built by the `torture` job above, but on a different
  # runner with its own `Swatinem/rust-cache` key, so this job's cold cache
  # still pays for both. (That sentence read "neither is produced by any other
  # job here", which was false of the `shm` build.)
  # The margin above that is for a slow runner, not for a longer run — a soak
  # that needs more than 5 minutes is a change to the recipe's `*ARGS`, and this
  # comment is what would have to move with it. (It read "10 minutes" beside a
  # `timeout-minutes: 25` and accounted for one build; corrected 2026-09-04.)
  crash-points:
    name: shm_torture --crash-points (§11.3 sites)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      # The harness's own detector first, for the `torture` job's reason: this
      # build cannot run it (the self-test binary is built without
      # `crash-points`, which is what lets it assert the *refusal*), so what it
      # buys here is the seconds-long check that the reader still reads before
      # five minutes of soak that assumes it does.
      - name: just shm-torture-self-test
        run: just shm-torture-self-test
      - name: just shm-torture-crash-points
        run: just shm-torture-crash-points

  sanitizers:
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # `tsan` is `docs/PHASE3.md` §7.3's concurrent read path;
        # `shm-torture-asan` is `docs/PHASE2.md` §11.4's "run it under ASan".
        #
        # There is no Rust UBSan row, and its absence is deliberate rather than
        # an omission: `rustc -Zsanitizer` accepts address, thread, leak, memory
        # and the CFI variants, and no `undefined`. §10's "ASan/UBSan/TSan" is a
        # C/C++ checklist; the UBSan half of it lives where there is C++ to
        # check, in `just cpp-check`, which runs the header-only wrapper under
        # `-fsanitize=undefined`.
        include:
          - { recipe: tsan, args: "" }
          # **§15's box is "runs 30 minutes nightly, clean, under ASan"**, and
          # the recipe's own default is 120 s — right for a local run, and not
          # what the box asks of the nightly. Passed explicitly here rather than
          # by moving the default, so `just shm-torture-asan` stays two minutes
          # for somebody checking a change. Four children rather than
          # `shm-torture`'s six: ASan's shadow memory and interceptors cost
          # enough that six under it is a different amount of work than six
          # without, and this job's budget has to cover a `-Zbuild-std` rebuild
          # as well as the run.
          #
          # **Four is the thinnest fleet the owner-kill arm accepts, and until
          # 2026-09-11 that was load-bearing in a way nobody had measured.** This
          # job was red on four of five nightlies; the cause was the reap window
          # in which nobody can inherit and every survivor keeps detaching, which
          # scales with the victim's dirty pages — 43-49 MB under ASan against a
          # plain child's 2.8, so 6.7 ms against 0.3 ms. **The plain build wedges
          # at these arguments too** (900 s, no sanitizer), so the green
          # `shm-torture` job above is green for its `--children 6` and not for
          # its lack of ASan: the two rows move two variables at once and were
          # never a controlled comparison.
          #
          # `--children 4` is **kept** here deliberately. The harness fix is the
          # `kill.in_progress` marker, and leaving this row at its thinnest fleet
          # is what makes this job the standing check that the marker works in
          # production rather than only in the ballast control. Raising it in the
          # same change would have moved two variables again.
          - { recipe: shm-torture-asan, args: "--duration 30m --children 4 --kill-hz 4" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just ${{ matrix.recipe }} ${{ matrix.args }}
        run: just ${{ matrix.recipe }} ${{ matrix.args }}

  # **The `tf2::BufferCore` differential, which ran in no automated gate at all.**
  #
  # `ci.yml`'s `tf2` job keeps `tf2-differential` and `tf2-replay` off every pull
  # request because they are minutes of work, and points here for where they do
  # run; this job is the other half of that sentence. They are *tests*, not
  # measurements:
  # `tf2-differential` checks tf_tree against tf2 on generated topologies and
  # `tf2-replay` does it over a real recorded `/tf` stream, both to a stated
  # tolerance, both host-independent. Excluding them from PRs and then not
  # running them anywhere left the migration-credibility claim ungated.
  #
  # `tf2-bench`, `tf2-bench-check`, `tf2-scaling` and `dds-bench` stay out on
  # purpose: those are timings, and a shared runner cannot produce one
  # meaningfully. `tf2-bench-check` is named even though "check" makes it sound
  # like the others here — it compares against `results-tf2.json`, so it is a
  # regression gate over *timings*, and a container's timings on a borrowed
  # runner are the denominator problem this project has already been bitten by.
  tf2-differential:
    name: tf2 differential + replay (container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just tf2-differential
        run: just tf2-differential
      - name: just tf2-replay
        run: just tf2-replay

  cpp-sanitizers:
    name: cpp-check (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Sophus is optional and its absence is *reported* by the recipe rather
      # than skipped silently, so this job is honest either way — but fetch it,
      # because the stride hazard §4.3 names only exists where Sophus does.
      - name: just cpp-deps
        run: just cpp-deps
      - name: just cpp-check
        run: just cpp-check

  # **PHASE5 §12's sharing gate, which ran in no workflow.**
  # `docs/benchmarks/EVIDENCE.md` registers `frozen_workers.rs` as a gate with a
  # recipe and records "PASSES at 1.024×"; `just gate4` was that recipe and
  # nothing invoked it, so the register's one gate row had the same shape as the
  # `abi_cost` failure the register was created to prevent — a recorded PASS that
  # nothing re-derived.
  #
  # **Nightly and not per-PR, and the reason is the profile, not the runtime.**
  # The measurement itself is nearly free, and it is a *memory* measurement, so
  # unlike everything in `bench-check` it does not care what else is on the host —
  # the recipe says as much ("needs no quiet host and no core parity"). The 338
  # MiB index is deleted first, because a reused one measures nothing about the
  # cost of producing it:
  #
  #     $ rm -f target/gate4/workers.tft && \
  #       /usr/bin/time -f "%e s  maxrss %M KB" just gate4
  #     gate 4, Rust worker: 235.4 MiB / 229.9 MiB = 1.024x against 1.2x — PASS
  #     1.92 s  maxrss 635688 KB
  #
  # matching EVIDENCE.md's 1.024× to three digits. What is not free is getting
  # there: `frozen_workers` is a `--release` build of `tf_tree_bench --features
  # shm`, and no pull-request job produces one — `ci.yml`'s `shm` job is a debug
  # nextest pass. Adding minutes of release compilation to every PR to re-derive a
  # ratio with 15 % of headroom is the wrong trade; a night is the right one.
  #
  # Its own job rather than a step on `torture`, which already has that release
  # tree: a 1.9-second gate must not be reported behind a 30-minute soak, and it
  # must not go unrun on a night the soak fails early.
  #
  # Disk: each of the two gates freezes its own gate-scale index under
  # `target/`. `just gate2` deletes its fixtures again on success, so what this
  # job holds afterwards is gate 4's index alone rather than both; ~620 MiB peak
  # RSS. Both well inside a hosted runner, and no total is written here — the
  # two recipes are where the sizes are stated, and this line has already been
  # wrong once by describing one index while the job produced two.
  #
  # **`just gate2` is a step of this job rather than a job of its own**, and for
  # the reason above read the other way: what is expensive is the `--release`
  # `--features shm` build of `tf_tree_bench`, which this job already pays for,
  # and gate 2 adds ~4 s of measurement on top of it. The stated reason gate 4
  # is not a step on `torture` — a two-second gate must not be reported behind a
  # thirty-minute soak — is satisfied by sharing *this* job, not by adding a
  # third. **The job id stays `gate4`** so that anything referring to it by name
  # keeps working; the display name is what moved.
  gate4:
    name: the .tft gates (open time, 16 workers sharing one file)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just gate2
        run: just gate2
      - name: just gate4
        run: just gate4
      # gate 5 needs no `shm` and its red test therefore runs per-PR in
      # `just test`; what runs here is the *release* measurement, because a
      # debug ingest reads about a tenth of the shipped one and the number this
      # job publishes should be the shipped one.
      - name: just gate5
        run: just gate5

  # **Nothing here notified anybody, and that is how four red nightlies in five
  # nights went unnoticed.**
  #
  # The jobs above have exited non-zero since 2026-09-04 and the run goes red,
  # but a red run on a schedule nobody watches is a tree falling in a forest: on
  # 2026-09-11 the state was found because a human *guessed* to look. A gate
  # whose failure reaches no one is the defect class this repository keeps
  # finding in its own assertions, one layer out — it cannot fail in the only
  # sense that matters.
  #
  # **It reports jobs, not the run.** A run's colour is not a job's colour: one
  # red job among six green ones reds the run, and an issue saying "nightly
  # failed" sends the reader back to the log-digging this job exists to spare
  # them. The body names each failed job and links straight to it, read from the
  # jobs API rather than from `needs.*.result`, so a job added above is reported
  # without an edit here. **That is not the same as "cannot be dropped", and the
  # `needs` list is still hand-maintained**: a job missing from it may not have
  # finished when this one runs, and an unfinished job has a `null` conclusion,
  # which is counted as neither failed nor inconclusive — it is this job reading
  # its own listing that forces that exclusion. So a new job must still be added
  # to `needs`; what it does not need is a second entry in the reporting code.
  #
  # **One issue, not one per night.** A fresh issue every 24 h for the same
  # standing failure is noise that gets muted, so a later run appends a comment
  # to the open `nightly-red` issue instead. And it **closes** that issue when
  # the nightly comes back green: an alert that never clears stops being read,
  # which is the failure mode one layer up from the one this job fixes. Only an
  # issue this workflow itself opened is closed — a human's issue carrying the
  # same label is commented on and left alone.
  #
  # `always()`: every `needs` job failing would otherwise skip this one, which is
  # exactly the case it exists for. `continue-on-error` so a permissions problem
  # or a rate limit reports itself without turning a green nightly red — this job
  # is the messenger and must never become the message.
  notify:
    name: report the night's result
    needs: [torture, crash-points, sanitizers, tf2-differential, cpp-sanitizers, gate4]
    # **The ref guard is load-bearing, and `always()` alone is not enough.**
    # `workflow_dispatch` above exists so a change to these recipes can be tried
    # without waiting a day, and it can be fired against **any** ref — this
    # repository already dispatches it. Without this condition, a green run on a
    # feature branch takes the green path below and **closes the standing alert
    # for a red `main`**, and a red one opens an issue whose body says "the
    # scheduled nightly" about a branch. A manual re-run of `main` is legitimate
    # and still reports, which is why this gates on the ref and not on the event.
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    # **`actions: read` is not optional here.** A job-level `permissions:` block
    # *replaces* the workflow default rather than adding to it, so naming only
    # `contents` and `issues` leaves `actions` at none — and this job's first
    # call is `GET /repos/{o}/{r}/actions/runs/{id}/jobs`, which needs it. The
    # failure would be a 403 inside the one job whose purpose is to tell somebody
    # when things break.
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: open, update or close the nightly-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Read the night's result from the jobs API rather than from this
          # job's own `needs` bookkeeping: it is the same source a human would
          # open, it carries per-job URLs, and it does not go stale when a job
          # is added above. This job is itself in the listing with a null
          # conclusion, so select on `failure` rather than on "not success" —
          # which also keeps `cancelled` and `skipped` out of the report.
          # **`--slurp` with `--paginate`.** Without it, a run with more jobs
          # than one page emits several concatenated JSON objects, and a `jq`
          # program ending in `| length` then prints one number *per page* — so
          # `inconclusive` becomes "0\n0" and every `[ "$inconclusive" != "0" ]`
          # test below takes the wrong branch. The nightly has seven jobs today
          # and would not paginate; `ci.yml` has twenty and is two thirds of the
          # way there. `--slurp` returns one array of pages, which flattens.
          jobs=$(gh api --paginate --slurp "repos/$REPO/actions/runs/$RUN_ID/jobs" |
            jq '{jobs: [.[].jobs[]]}')

          # A job that **timed out** is a red job: every long job here runs a
          # bounded-duration recipe inside a larger `timeout-minutes`, so a
          # timeout is a recipe that stopped making progress rather than a
          # scheduling accident. (An earlier revision of this comment said
          # `shm_torture` had "a 90-minute budget"; 90 is the *sanitizers* job's
          # and `torture`'s is 50. No number is quoted now — the `timeout-minutes`
          # keys above are the register and nothing here audits a copy of them.)
          failed=$(printf '%s' "$jobs" | jq -r \
            '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")
             | "- **\(.name)** — \(.html_url)"')

          # **Cancelled is not green, and `if: always()` means this job runs on a
          # cancelled run too.** Without this, a run somebody stopped by hand has
          # no job with conclusion `failure`, `failed` comes back empty, and the
          # green branch below would **close the standing alert** on the strength
          # of a run that proved nothing. `null` is excluded deliberately: it is
          # this job, still in progress, looking at its own listing.
          inconclusive=$(printf '%s' "$jobs" | jq -r \
            '[.jobs[] | select(.conclusion != null)
              | select(.conclusion != "success" and .conclusion != "failure"
                       and .conclusion != "timed_out")] | length')

          # The label the query below filters on. Idempotent: the 422 this
          # returns once the label exists is the steady state, not an error.
          gh api -X POST "repos/$REPO/labels" \
            -f name=nightly-red \
            -f color=B60205 \
            -f description='The scheduled nightly run has a failing job' \
            >/dev/null 2>&1 || true

          # **`select(.pull_request == null)`, because this endpoint returns
          # pull requests too.** GitHub's issues API treats a PR as an issue, so
          # a PR that happened to carry this label would be picked up and
          # commented on — and, on a green night, *closed*. Filtering here is
          # cheaper than discovering it the once it happens.
          # **Select the issue this workflow opened, not the newest one wearing
          # the label.** The query is sorted newest-created-first by default, so
          # a human who opens their own `nightly-red` issue *after* the bot's
          # becomes `.[0]` — and then the author test below fails forever, the
          # bot's issue can never be closed, and every later red night comments
          # on the human's. Filtering by author at selection time makes the two
          # independent: ours is found whatever else carries the label.
          standing=$(gh api "repos/$REPO/issues?state=open&labels=nightly-red&per_page=100")
          number=$(printf '%s' "$standing" | jq -r '
            map(select(.pull_request == null and .user.login == "github-actions[bot]"))
            | .[0].number // empty')

          # Built with printf rather than a multi-line shell string: every line
          # of this script lives inside a YAML block scalar, so a continuation
          # line at column 0 leaves the scalar and a line indented to match it
          # reaches Markdown as an indented code block. printf is the spelling
          # that is correct in both.
          if [ -z "$failed" ] && [ "$inconclusive" != "0" ]; then
            echo "nightly neither passed nor failed ($inconclusive job(s) cancelled or"
            echo "awaiting action). Leaving any standing issue alone: a run that was"
            echo "stopped is not evidence the nightly is healthy."
            exit 0
          fi

          if [ -z "$failed" ]; then
            if [ -n "$number" ]; then
              body=$(printf '%s\n' \
                "Nightly is green again on \`$SHA\`, so this is closed." \
                "" \
                "Run: $RUN_URL")
              gh api -X POST "repos/$REPO/issues/$number/comments" -f body="$body" >/dev/null
              gh api -X PATCH "repos/$REPO/issues/$number" -f state=closed >/dev/null
              echo "nightly green — closed #$number"
            else
              echo "nightly green — no standing issue of ours to clear"
            fi
            exit 0
          fi

          body=$(printf '%s\n' \
            "The scheduled nightly has failing job(s) on \`$SHA\`." \
            "" \
            "$failed" \
            "" \
            "Run: $RUN_URL" \
            "" \
            "Judge **per job**. The rest of this run passed, and a red run is not" \
            "a red job — each link above goes to that job's own log.")

          if [ -n "$number" ]; then
            gh api -X POST "repos/$REPO/issues/$number/comments" -f body="$body" >/dev/null
            echo "commented on #$number"
          else
            n=$(gh api -X POST "repos/$REPO/issues" \
              -f title='Nightly is red' \
              -f body="$body" \
              -f 'labels[]=nightly-red' \
              --jq '.number')
            echo "opened #$n"
          fi
