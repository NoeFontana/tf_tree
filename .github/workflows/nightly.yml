name: nightly

# Jobs that do not belong on a pull request (`docs/PHASE5.md` §10); each invokes
# a `just` recipe. A green tick means one pass on a hosted x86-64 runner.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  torture:
    name: shm_torture (30 min)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      # Self-test first: a broken detector would pass meaninglessly.
      - name: just shm-torture-self-test
        run: just shm-torture-self-test
      - name: just shm-torture
        run: just shm-torture

  # `docs/PHASE2.md` §11.4's other half: a crash point armed in ~10% of children.
  # The binary refuses a run that armed or fired nothing
  # (`a_run_that_validates_nothing_fails_instead_of_passing`). A longer soak means
  # changing the recipe's `*ARGS`.
  crash-points:
    name: shm_torture --crash-points (§11.3 sites)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: just shm-torture-self-test
        run: just shm-torture-self-test
      - name: just shm-torture-crash-points
        run: just shm-torture-crash-points

  sanitizers:
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # `tsan`: `docs/PHASE3.md` §7.3; `shm-torture-asan`: `docs/PHASE2.md` §11.4.
        # UBSan is `just cpp-check`.
        include:
          - { recipe: tsan, args: "" }
          # §15's box: 30 minutes under ASan; four children is the thinnest fleet
          # the owner-kill arm accepts (`kill.in_progress`).
          - { recipe: shm-torture-asan, args: "--duration 30m --children 4 --kill-hz 4" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just ${{ matrix.recipe }} ${{ matrix.args }}
        run: just ${{ matrix.recipe }} ${{ matrix.args }}

  # Host-independent tf2 tests kept off PRs by `ci.yml`; the tf2 and DDS timings
  # stay out because a shared runner cannot produce them.
  tf2-differential:
    name: tf2 differential + replay (container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just tf2-differential
        run: just tf2-differential
      - name: just tf2-replay
        run: just tf2-replay

  cpp-sanitizers:
    name: cpp-check (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Sophus for the §4.3 stride hazard.
      - name: just cpp-deps
        run: just cpp-deps
      - name: just cpp-check
        run: just cpp-check

  # PHASE5 §12's sharing gates, on a `--release` build of `tf_tree_bench --features
  # shm` that no PR job produces. The job id stays `gate4`.
  gate4:
    name: the .tft gates (open time, 16 workers sharing one file)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just gate2
        run: just gate2
      - name: just gate4
        run: just gate4
      - name: just gate5
        run: just gate5

  # Reports jobs, not the run. One `nightly-red` issue: later runs comment on it and
  # a green night closes it, if this workflow opened it. The `needs` list is hand-kept.
  notify:
    name: report the night's result
    needs: [torture, crash-points, sanitizers, tf2-differential, cpp-sanitizers, gate4]
    # The ref guard is load-bearing: a green feature-branch dispatch must not close a red `main`'s alert.
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    # `actions: read`: a job-level `permissions:` replaces the default.
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: open, update or close the nightly-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Jobs API, not `needs`; `--slurp` flattens pages.
          jobs=$(gh api --paginate --slurp "repos/$REPO/actions/runs/$RUN_ID/jobs" |
            jq '{jobs: [.[].jobs[]]}')

          failed=$(printf '%s' "$jobs" | jq -r \
            '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out")
             | "- **\(.name)** — \(.html_url)"')

          # Cancelled is not green; `null` is this job itself.
          inconclusive=$(printf '%s' "$jobs" | jq -r \
            '[.jobs[] | select(.conclusion != null)
              | select(.conclusion != "success" and .conclusion != "failure"
                       and .conclusion != "timed_out")] | length')

          # Idempotent; 422 means the label exists.
          gh api -X POST "repos/$REPO/labels" \
            -f name=nightly-red \
            -f color=B60205 \
            -f description='The scheduled nightly run has a failing job' \
            >/dev/null 2>&1 || true

          # The issues API returns PRs too; select the issue this workflow opened.
          standing=$(gh api "repos/$REPO/issues?state=open&labels=nightly-red&per_page=100")
          number=$(printf '%s' "$standing" | jq -r '
            map(select(.pull_request == null and .user.login == "github-actions[bot]"))
            | .[0].number // empty')

          if [ -z "$failed" ] && [ "$inconclusive" != "0" ]; then
            echo "nightly neither passed nor failed ($inconclusive job(s) cancelled or"
            echo "awaiting action). Leaving any standing issue alone: a run that was"
            echo "stopped is not evidence the nightly is healthy."
            exit 0
          fi

          if [ -z "$failed" ]; then
            if [ -n "$number" ]; then
              body=$(printf '%s\n' \
                "Nightly is green again on \`$SHA\`, so this is closed." \
                "" \
                "Run: $RUN_URL")
              gh api -X POST "repos/$REPO/issues/$number/comments" -f body="$body" >/dev/null
              gh api -X PATCH "repos/$REPO/issues/$number" -f state=closed >/dev/null
              echo "nightly green — closed #$number"
            else
              echo "nightly green — no standing issue of ours to clear"
            fi
            exit 0
          fi

          body=$(printf '%s\n' \
            "The scheduled nightly has failing job(s) on \`$SHA\`." \
            "" \
            "$failed" \
            "" \
            "Run: $RUN_URL" \
            "" \
            "Judge **per job**. The rest of this run passed, and a red run is not" \
            "a red job — each link above goes to that job's own log.")

          if [ -n "$number" ]; then
            gh api -X POST "repos/$REPO/issues/$number/comments" -f body="$body" >/dev/null
            echo "commented on #$number"
          else
            n=$(gh api -X POST "repos/$REPO/issues" \
              -f title='Nightly is red' \
              -f body="$body" \
              -f 'labels[]=nightly-red' \
              --jq '.number')
            echo "opened #$n"
          fi
