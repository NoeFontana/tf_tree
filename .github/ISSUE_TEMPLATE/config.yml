# Blank issues stay on: the most valuable report is a surprise that fits no form
# (`docs/PHASE4.md` §1.2).
# GitHub silently drops labels that do not exist: `surprise-log` and `needs-triage`
# (surprise.yml, bug.yml) must be created with `gh label create`.
# surprise.yml's J-row dropdown copies `docs/PHASE7.md` §4's table; change both together.
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability — do not open an issue
    url: https://github.com/NoeFontana/tf_tree/blob/main/SECURITY.md
    about: >-
      Mail the address in SECURITY.md instead. It also states the threat model up front,
      which will save you time: processes sharing an arena are mutually trusting by design,
      so "a read-write participant can corrupt the arena" is documented rather than a
      defect — while memory unsafety from safe Rust, a crafted arena header, and anything
      a read-only participant can do to another are all in scope.
  - name: What is supported, and what response to expect
    url: https://github.com/NoeFontana/tf_tree/blob/main/SUPPORT.md
    about: >-
      A single-maintainer, pre-1.0 project with honestly scoped timelines: Linux first, the
      current release only, and a per-kind triage expectation. It is also where the platform
      answers are, and they are not all the same answer.
      since 2026-07-23, so a green check on a pull request is not evidence of anything.
  - name: Propose a change the documents do not already cover
    url: https://github.com/NoeFontana/tf_tree/blob/main/docs/decisions/README.md
    about: >-
      New public API, a new crate boundary, a different concurrency protocol, or a feature
      that widens the scope: those start as a decision record, not as an issue and not as a
      pull request. Several things this project deliberately does not do are recorded with
      the argument attached — refuting one is a real path, and this is where it runs.
